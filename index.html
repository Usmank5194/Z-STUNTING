<script>
/* ==================== CONFIG ==================== */
const CLOUD_URL = 'https://gwiripziiwgumxymdmso.supabase.co';
const CLOUD_KEY = 'sb_publishable_2UBNn2dU3qBJZLjgOm-FKA_hPUK7eUi';
const KECAMATAN = ['ARUNGKEKE','BANGKALA','BANGKALA BARAT','BATANG','BINAMU','BONTORAMBA','KELARA','RUMBIA','TAMALATEA','TAROWANG','TURATEA'];
const DEFAULT_PASS = 'zstunting';
const ADMIN_ACCOUNTS = [
  { u:'penyuluh', p:'zstunting2026', nama:'Penyuluh KB Jeneponto' },
  { u:'penyuluh', p:'zstunting',     nama:'Penyuluh KB Jeneponto' },
  { u:'penyuluh', p:'admin123',      nama:'Penyuluh KB Jeneponto' },
  { u:'penyuluh', p:'penyuluh123',   nama:'Penyuluh KB Jeneponto' }
];

const APP = {
  user:null, state:{cases:[],tpk:[],accounts:[],auditLog:[]},
  filters:{search:'',kecamatan:'',status_gizi:'',status_pendampingan:''},
  page:1, pageSize:20,
  currentDetail:null, currentEdit:null, currentKunjungan:null
};
let _sb = null;

/* ==================== HELPERS ==================== */
const esc = s => String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtNum = n => (n||0).toLocaleString('id-ID');
const findTeam = id => (APP.state.tpk||[]).find(t => t.teamId === id);
const badgeGizi = s => { const m={'Stunting':'badge-danger','Gizi Kurang':'badge-warning','Gizi Buruk':'badge-danger','Ideal':'badge-success'}; return `<span class="badge ${m[s]||'badge-gray'}">${s||'-'}</span>`; };
const badgePend = s => { const m={'Belum Dikunjungi':'badge-gray','Sudah Dikunjungi':'badge-info','Dalam Pendampingan':'badge-warning','Graduated':'badge-success'}; return `<span class="badge ${m[s]||'badge-gray'}">${s||'-'}</span>`; };

function toast(msg, type=''){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show ' + type;
  clearTimeout(t._tm); t._tm = setTimeout(()=>{ t.className=''; }, 3500);
}
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function showLoading(t){ document.getElementById('loadingText').textContent = t||'Memuat...'; document.getElementById('loading').classList.add('show'); }
function hideLoading(){ document.getElementById('loading').classList.remove('show'); }
function togglePwd(){
  const p = document.getElementById('password');
  const b = document.getElementById('eyeBtn');
  if(!p||!b) return;
  if(p.type === 'password'){ p.type = 'text'; b.textContent = '🙈'; }
  else { p.type = 'password'; b.textContent = '👁️'; }
}

/* ==================== CLOUD ==================== */
const Cloud = {
  status:'local', timer:null,
  init(){
    if(!_sb) _sb = supabase.createClient(CLOUD_URL, CLOUD_KEY);
    this.status = 'online'; this.updateIndicator();
    if(!this.timer) this.timer = setInterval(() => { if(APP.user) this.pull(true); }, 60000);
  },
  async push(){
    if(!_sb) return;
    try {
      this.setStatus('syncing');
      const {error} = await _sb.from('sistunting_state').upsert({ id:'main', data:APP.state, updated_at:new Date().toISOString() });
      if(error) throw error;
      this.setStatus('online');
    } catch(e){ console.error(e); this.setStatus('error'); }
  },
  async pull(silent=false){
    if(!_sb) return;
    try {
      if(!silent) this.setStatus('syncing');
      const {data, error} = await _sb.from('sistunting_state').select('*').eq('id','main').maybeSingle();
      if(error) throw error;
      if(!data || !data.data){ this.setStatus('online'); return; }
      const cloudTime = new Date(data.updated_at);
      const localTime = APP.state.savedAt ? new Date(APP.state.savedAt) : new Date(0);
      if(cloudTime > localTime){
        APP.state = data.data;
        ['cases','tpk','accounts','auditLog'].forEach(k => { if(!APP.state[k]) APP.state[k] = []; });
        localStorage.setItem('zstunting_state', JSON.stringify(APP.state));
        if(APP.user && !silent){
          toast('📥 Data diperbarui','success');
          const active = document.querySelector('.nav-item.active')?.dataset.view || 'dashboard';
          showView(active, document.querySelector('.nav-item.active'));
          updateBadge();
        }
      }
      this.setStatus('online');
    } catch(e){ this.setStatus('error'); }
  },
  setStatus(s){ this.status = s; this.updateIndicator(); },
  updateIndicator(){
    const el = document.getElementById('syncStatus');
    if(!el) return;
    const map = { online:['online','☁️ Cloud'], syncing:['syncing','🔄 Sync...'], error:['error','⚠️ Error'], local:['','📱 Local'] };
    const [cls, txt] = map[this.status] || map.local;
    el.className = 'sync-status ' + cls;
    el.innerHTML = '<span class="dot"></span> ' + txt;
  }
};

/* ==================== LOGIN ==================== */
async function doLogin(e){
  e.preventDefault();
  const u = (document.getElementById('username').value||'').trim().toLowerCase();
  const p = (document.getElementById('password').value||'').trim();
  if(!u || !p){ toast('Isi username & password','error'); return false; }
  showLoading('Memverifikasi...');
  
  try {
    if(!_sb) _sb = supabase.createClient(CLOUD_URL, CLOUD_KEY);
    const {data, error} = await _sb.from('sistunting_state').select('*').eq('id','main').maybeSingle();
    if(error) throw error;
    let state = (data && data.data) || { cases:[], tpk:[], accounts:[], auditLog:[] };
    ['cases','tpk','accounts','auditLog'].forEach(k => { if(!state[k]) state[k] = []; });
    
    // Cek admin
    const admin = ADMIN_ACCOUNTS.find(a => a.u === u && a.p === p);
    if(admin){
      APP.user = { username:u, nama:admin.nama, role:'admin', avatar:'PK' };
      APP.state = state;
      localStorage.setItem('zstunting_state', JSON.stringify(state));
      localStorage.setItem('zstunting_session', JSON.stringify({ username:u, at:new Date().toISOString() }));
      hideLoading();
      enterApp();
      toast('Selamat datang, ' + admin.nama, 'success');
      return false;
    }
    
    // Cek kader
    const acc = state.accounts.find(a => a.username === u);
    if(!acc || String(acc.password||'').trim() !== p){
      hideLoading(); toast('Username/password salah!','error'); return false;
    }
    const team = state.tpk.find(t => t.teamId === acc.teamId);
    if(!team){ hideLoading(); toast('Tim tidak ditemukan','error'); return false; }
    APP.user = { username:u, nama:'Tim ' + team.tim + ' · ' + team.desa, role:'kader', avatar:'TPK', teamId:acc.teamId, teamInfo:team };
    APP.state = state;
    localStorage.setItem('zstunting_state', JSON.stringify(state));
    localStorage.setItem('zstunting_session', JSON.stringify({ username:u, at:new Date().toISOString() }));
    hideLoading();
    enterApp();
    toast('Selamat datang, ' + APP.user.nama, 'success');
  } catch(err){
    console.warn(err);
    // Fallback admin offline
    const admin = ADMIN_ACCOUNTS.find(a => a.u === u && a.p === p);
    if(admin){
      const local = localStorage.getItem('zstunting_state');
      APP.state = local ? JSON.parse(local) : { cases:[], tpk:[], accounts:[], auditLog:[] };
      ['cases','tpk','accounts','auditLog'].forEach(k => { if(!APP.state[k]) APP.state[k] = []; });
      APP.user = { username:u, nama:admin.nama, role:'admin', avatar:'PK' };
      localStorage.setItem('zstunting_session', JSON.stringify({ username:u, at:new Date().toISOString() }));
      hideLoading();
      enterApp();
      toast('⚠️ Mode offline — data dari cache','warning');
      return false;
    }
    hideLoading();
    toast('Koneksi error, coba lagi','error');
  }
  return false;
}

function enterApp(){
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = 'block';
  Cloud.init();
  initApp();
}

function logout(){
  if(confirm('Keluar dari Z-STUNTING?')){
    saveState();
    localStorage.removeItem('zstunting_session');
    APP.user = null;
    document.getElementById('appView').style.display = 'none';
    document.getElementById('loginView').style.display = 'flex';
    renderLoginView();
  }
}
function saveState(){
  APP.state.savedAt = new Date().toISOString();
  localStorage.setItem('zstunting_state', JSON.stringify(APP.state));
  Cloud.push();
}

/* ==================== AUTO LOGIN ==================== */
async function tryAutoLogin(){
  const s = localStorage.getItem('zstunting_session');
  if(!s) return;
  try {
    const { username } = JSON.parse(s);
    if(!username) return;
    if(!_sb) _sb = supabase.createClient(CLOUD_URL, CLOUD_KEY);
    const {data} = await _sb.from('sistunting_state').select('*').eq('id','main').maybeSingle();
    let state = (data && data.data) || { cases:[], tpk:[], accounts:[], auditLog:[] };
    ['cases','tpk','accounts','auditLog'].forEach(k => { if(!state[k]) state[k] = []; });
    
    const admin = ADMIN_ACCOUNTS.find(a => a.u === username);
    if(admin){
      APP.user = { username, nama:admin.nama, role:'admin', avatar:'PK' };
    } else {
      const acc = state.accounts.find(a => a.username === username);
      if(!acc){ localStorage.removeItem('zstunting_session'); return; }
      const team = state.tpk.find(t => t.teamId === acc.teamId);
      if(!team){ localStorage.removeItem('zstunting_session'); return; }
      APP.user = { username, nama:'Tim ' + team.tim + ' · ' + team.desa, role:'kader', avatar:'TPK', teamId:acc.teamId, teamInfo:team };
    }
    APP.state = state;
    localStorage.setItem('zstunting_state', JSON.stringify(state));
    enterApp();
  } catch(e){ console.warn('Auto-login gagal:', e); }
}

function getFilteredCases(){
  let arr = visibleCases();
  const f = APP.filters;
  if(f.search){ const s = f.search.toLowerCase(); arr = arr.filter(x => (x.nama||'').toLowerCase().includes(s) || (x.nik||'').includes(s) || (x.desa||'').toLowerCase().includes(s)); }
  if(f.kecamatan) arr = arr.filter(x => x.kecamatan === f.kecamatan);
  if(f.status_gizi) arr = arr.filter(x => x.status_gizi === f.status_gizi);
  if(f.status_pendampingan) arr = arr.filter(x => x.status_pendampingan === f.status_pendampingan);
  return arr;
}
let _ft = null;
function updateFilter(key,val){
  APP.filters[key] = val; APP.page = 1;
  if(_ft) clearTimeout(_ft);
  _ft = setTimeout(() => {
    const inp = document.getElementById('filterSearch');
    const pos = inp ? inp.selectionStart : null;
    renderKasus(document.getElementById('content'));
    const inpNew = document.getElementById('filterSearch');
    if(inpNew){ inpNew.focus(); if(pos!==null){ try{ inpNew.setSelectionRange(pos,pos); }catch(e){} } }
  }, 400);
}
function resetFilters(){ APP.filters = {search:'',kecamatan:'',status_gizi:'',status_pendampingan:''}; APP.page = 1; renderKasus(document.getElementById('content')); }
function gotoPage(p){ APP.page = p; renderKasus(document.getElementById('content')); }

function generateAllAccounts(){
  const tpk = APP.state.tpk || [];
  if(tpk.length === 0){ toast('Import Data TPK dulu','warning'); return; }
  if(!confirm(`Generate ${tpk.length} akun? Akun lama akan diganti.`)) return;
  const sorted = tpk.slice().sort((a,b) => {
    const kc = a.kecamatan.localeCompare(b.kecamatan);
    if(kc !== 0) return kc;
    const dc = a.desa.localeCompare(b.desa);
    if(dc !== 0) return dc;
    return a.tim - b.tim;
  });
  APP.state.accounts = sorted.map((t, i) => ({
    username: 'tpk' + String(i+1).padStart(3, '0'),
    password: DEFAULT_PASS,
    teamId: t.teamId
  }));
  saveState();
  toast(`✅ ${APP.state.accounts.length} akun dibuat`,'success');
  renderAkun(document.getElementById('content'));
}
function exportAccountsCSV(){
  const accounts = APP.state.accounts || [];
  const tpk = APP.state.tpk || [];
  const headers = ['username','password','kecamatan','desa','tim','bidan','hp_bidan'];
  const rows = accounts.map(a => {
    const t = tpk.find(x => x.teamId === a.teamId);
    return [a.username, a.password, t?.kecamatan||'', t?.desa||'', t?.tim||'', t?.bidan?.nama||'', t?.bidan?.hp||''];
  });
  const csv = [headers, ...rows].map(r => r.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ZSTUNTING_Akun_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
  toast('✅ CSV diunduh','success');
}

  const d = document.getElementById('zDisplay');
  if(isNaN(bb)||isNaN(tb)||bb<=0||tb<=0){ d.innerHTML = ''; return; }
  const zB = zBBU(bb, x.usia_bulan||0, x.jk);
  const zT = zTBU(tb, x.usia_bulan||0, x.jk);
  const st = klasifikasiZ(zB, zT);
  document.getElementById('k_gizi').value = st;
  d.innerHTML = `<div class="zscore-card ${st==='Ideal'?'':(zT<-3||zB<-3?'bad':'warn')}">
    <div style="font-weight:700;font-size:12px;margin-bottom:6px">🎯 Skor Z</div>
    <div class="zscore-row"><span>BB/U</span><b>${zB.toFixed(2)}</b></div>

}

/* ==================== WHO Z-SCORE ==================== */
function interpVal(age, arr){
  const A = [0,3,6,9,12,18,24,36,48,60];
  if(age <= A[0]) return arr[0];
  if(age >= A[A.length-1]) return arr[arr.length-1];
  for(let i=0;i<A.length-1;i++){ if(age>=A[i] && age<=A[i+1]){ const t=(age-A[i])/(A[i+1]-A[i]); return arr[i]+t*(arr[i+1]-arr[i]); } }
  return arr[arr.length-1];
}
function zBBU(bb, age, jk){
  const M = jk==='L' ? [3.3,6.4,7.9,8.9,9.6,10.9,12.2,14.3,16.3,18.3] : [3.2,5.8,7.3,8.2,8.9,10.2,11.5,13.9,16.1,18.2];
  const S = jk==='L' ? [0.5,0.8,0.9,0.9,1.0,1.1,1.3,1.5,1.8,2.1] : [0.5,0.7,0.8,0.9,1.0,1.2,1.4,1.6,1.9,2.2];
  const med = interpVal(age, M), sd = interpVal(age, S);
  return (bb-med)/sd;
}
function zTBU(tb, age, jk){
  const M = jk==='L' ? [49.9,61.4,67.6,72.0,75.7,82.3,87.8,96.1,103.3,110.0] : [49.1,59.8,65.9,70.4,74.0,80.7,86.4,95.1,102.7,109.4];
  const S = jk==='L' ? [1.9,2.1,2.3,2.4,2.5,2.8,3.0,3.5,4.0,4.5] : [1.8,2.1,2.2,2.4,2.5,2.8,3.1,3.6,4.1,4.6];
  const med = interpVal(age, M), sd = interpVal(age, S);
  return (tb-med)/sd;
}
function klasifikasiZ(zB, zT){
  if(zT < -2) return 'Stunting';
  if(zB < -3) return 'Gizi Buruk';
  if(zB < -2) return 'Gizi Kurang';
  return 'Ideal';
}

async function importTPKExcel(){
  const f = document.getElementById('excelTPK').files[0];
  if(!f){ toast('Pilih file Excel','warning'); return; }
  showLoading('Parsing Excel...');
  try {
    const buf = await f.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    let cKec = '', cDesa = '', cTim = 0;
    const teams = {};
    for(let i=0; i<rows.length; i++){
      const r = rows[i];
      if(!r || !r[4]) continue;
      const nama = String(r[4]).trim();
      if(!nama || nama.toLowerCase().includes('nama tpk')) continue;
      if(nama.toLowerCase().includes('jumlah peserta')) continue;
      if(/^\d+\s*orang$/i.test(nama)) continue;
      if(r[1] && String(r[1]).trim()) cKec = String(r[1]).trim().toUpperCase();
      if(r[2] && String(r[2]).trim()) cDesa = String(r[2]).trim();
      if(r[3] && String(r[3]).trim()){ const m = String(r[3]).match(/(\d+)/); if(m) cTim = parseInt(m[1]); }
      if(!cKec || !cDesa || !cTim) continue;
      const unsur = String(r[5]||'').trim().toLowerCase();
      const hp = String(r[6]||'').trim().replace(/['\s\.]/g,'');
      const key = cKec + '#' + cDesa + '#' + cTim;
      if(!teams[key]) teams[key] = {kecamatan:cKec, desa:cDesa, tim:cTim, bidan:null, pkk:null, kb:null};
      const t = teams[key];
      if(unsur.includes('bidan')) t.bidan = {nama, hp};
      else if(unsur.includes('pkk')) t.pkk = {nama, hp};
      else if(unsur.includes('kb')) t.kb = {nama, hp};
    }
    const list = Object.values(teams).filter(t => t.bidan || t.pkk || t.kb).map((t,i) => ({
      id: 'TPK'+String(i+1).padStart(4,'0'),
      teamId: 'TIM-'+t.kecamatan.replace(/\s/g,'')+'-'+t.desa.replace(/\s/g,'')+'-'+t.tim,
      kecamatan: t.kecamatan, desa: t.desa, tim: t.tim,
      bidan: t.bidan || {nama:'-',hp:'-'}, pkk: t.pkk || {nama:'-',hp:'-'}, kb: t.kb || {nama:'-',hp:'-'}
    }));
    if(list.length === 0){ hideLoading(); toast('❌ Tidak ada data','error'); return; }
    if(!confirm(`Import ${list.length} tim TPK?`)){ hideLoading(); return; }
    APP.state.tpk = list;
    autoAssign();
    // Auto-generate akun
    const sorted = list.slice().sort((a,b) => {
      const kc = a.kecamatan.localeCompare(b.kecamatan);
      if(kc !== 0) return kc;
      const dc = a.desa.localeCompare(b.desa);
      if(dc !== 0) return dc;
      return a.tim - b.tim;
    });
    APP.state.accounts = sorted.map((t, i) => ({ username:'tpk'+String(i+1).padStart(3,'0'), password:DEFAULT_PASS, teamId:t.teamId }));
    saveState();
    hideLoading();
    toast(`✅ ${list.length} tim + ${list.length} akun dibuat`,'success');
    updateBadge();
    showView('tpk', document.querySelector('.nav-item[data-view="tpk"]'));
  } catch(e){ hideLoading(); console.error(e); toast('❌ Gagal: ' + e.message,'error'); }
}
function autoAssign(){
  const groups = {};
  (APP.state.tpk||[]).forEach(t => {
    const key = t.kecamatan + '||' + (t.desa||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(!groups[key]) groups[key] = [];
    groups[key].push(t);
  });
  const kecOnly = {};
  (APP.state.tpk||[]).forEach(t => { if(!kecOnly[t.kecamatan]) kecOnly[t.kecamatan] = []; kecOnly[t.kecamatan].push(t); });
  const counters = {};
  (APP.state.tpk||[]).forEach(t => counters[t.teamId] = 0);
  (APP.state.cases||[]).forEach(c => {
    const kk = (c.kecamatan||'').toUpperCase();
    const kd = (c.desa||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    let pool = groups[kk+'||'+kd] || kecOnly[kk];
    if(!pool || !pool.length){ c.team_id = null; return; }
    pool.sort((a,b) => counters[a.teamId] - counters[b.teamId]);
    c.team_id = pool[0].teamId;
    counters[pool[0].teamId]++;
  });
}
function importBNBA(){
  const f = document.getElementById('csvBNBA').files[0];
  if(!f){ toast('Pilih file CSV','warning'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const lines = e.target.result.split(/\r?\n/).filter(l => l.trim());
    if(lines.length < 2){ toast('File kosong','error'); return; }
    const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/"/g,''));
    const rows = lines.slice(1).map(line => {
      const vals = []; let cur = ''; let inQ = false;
      for(let i=0; i<line.length; i++){
        const ch = line[i];
        if(ch === '"'){ if(inQ && line[i+1]==='"'){ cur+='"'; i++; } else inQ = !inQ; }
        else if(ch === ',' && !inQ){ vals.push(cur); cur = ''; }
        else cur += ch;
      }
      vals.push(cur);
      const o = {}; headers.forEach((h,i) => o[h] = (vals[i]||'').trim()); return o;
    });
    const cases = rows.map((r,i) => ({
      id: 'CS' + Date.now() + '_' + i,
      nik: r.nik||'', no_kk: r.no_kk||'', nama: r.nama||'', jk: r.jk||'L',
      tgl_lahir: r.tgl_lahir||'', usia_bulan: parseInt(r.usia_bulan)||0,
      nama_ibu: r.nama_ibu||'', nama_ayah: r.nama_ayah||'',
      alamat: r.alamat||'', desa: r.desa||'', kecamatan: (r.kecamatan||'').toUpperCase(),
      posyandu: r.posyandu||'', hp_ortu: r.hp_ortu||'',
      bb: parseFloat(r.bb)||0, tb: parseFloat(r.tb)||0,
      status_gizi: r.status_gizi||'Ideal', status_pendampingan:'Belum Dikunjungi',
      team_id:null, riwayat:[], tgl_ukur_terakhir: new Date().toISOString().slice(0,10)
    })).filter(c => c.nama);
    if(cases.length === 0){ toast('Tidak ada data valid','error'); return; }
    if(!confirm(`Import ${cases.length} kasus? Data lama (${(APP.state.cases||[]).length}) akan diganti.`)) return;
    APP.state.cases = cases;
    autoAssign();
    saveState();
    toast(`✅ ${cases.length} kasus diimport`,'success');
    updateBadge();
    showView('kasus', document.querySelector('.nav-item[data-view="kasus"]'));
  };
  reader.readAsText(f);
}
function exportCSV(){
  const arr = APP.state.cases || [];
  const headers = ['nik','no_kk','nama','jk','tgl_lahir','usia_bulan','nama_ibu','nama_ayah','alamat','desa','kecamatan','hp_ortu','bb','tb','status_gizi','status_pendampingan'];
  const rows = arr.map(x => [x.nik,x.no_kk,x.nama,x.jk,x.tgl_lahir,x.usia_bulan,x.nama_ibu,x.nama_ayah,x.alamat,x.desa,x.kecamatan,x.hp_ortu,x.bb,x.tb,x.status_gizi,x.status_pendampingan]);
  const csv = [headers, ...rows].map(r => r.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ZSTUNTING_Kasus_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
  toast('✅ CSV diunduh','success');
}

                  <th style="padding:8px;text-align:left;border:1px solid #cbd5e1">Kecamatan</th>
                  <th style="padding:8px;text-align:left;border:1px solid #cbd5e1">Status Gizi</th>

              <tbody>
                ${allCases.slice(0,500).map((x,i) => `

                    <td style="padding:6px 8px;border:1px solid #e5e7eb">${x.jk||'-'}</td>

        </style>`;
    };
    
    // ==== Excel export ====
    window.exportExcelReport = function(){
      if(typeof XLSX === 'undefined'){ toast('Library Excel belum siap','error'); return; }
      const allCases = APP.user.role === 'admin' 
        ? (APP.state.cases||[]) 
        : (APP.state.cases||[]).filter(x => x.team_id === APP.user.teamId);
      
      // Sheet 1: Ringkasan
      const byGizi = {Stunting:0,'Gizi Kurang':0,'Gizi Buruk':0,Ideal:0};
      allCases.forEach(x => { if(byGizi[x.status_gizi] !== undefined) byGizi[x.status_gizi]++; });
      const ringkasan = [
        ['LAPORAN Z-STUNTING'],
        ['DP2KBP3A Kabupaten Jeneponto'],
        [],
        ['Tanggal Laporan', new Date().toLocaleDateString('id-ID')],
        ['Total Kasus', allCases.length],
        [],
        ['Status Gizi', 'Jumlah'],
        ['Stunting', byGizi.Stunting],
        ['Gizi Kurang', byGizi['Gizi Kurang']],
        ['Gizi Buruk', byGizi['Gizi Buruk']],
        ['Ideal', byGizi.Ideal]
      ];
      const ws1 = XLSX.utils.aoa_to_sheet(ringkasan);
      ws1['!cols'] = [{wch:25},{wch:30}];
      
      // Sheet 2: Detail Kasus
      const detail = allCases.map((x,i) => ({
        'No': i+1,
        'NIK': x.nik||'',
        'No KK': x.no_kk||'',
        'Nama Balita': x.nama||'',
        'JK': x.jk||'',
        'Tgl Lahir': x.tgl_lahir||'',
        'Usia (bln)': x.usia_bulan||0,
        'Nama Ibu': x.nama_ibu||'',
        'Nama Ayah': x.nama_ayah||'',
        'Alamat': x.alamat||'',
        'Desa': x.desa||'',
        'Kecamatan': x.kecamatan||'',
        'Posyandu': x.posyandu||'',
        'HP Ortu': x.hp_ortu||'',
        'BB (kg)': x.bb||'',
        'TB (cm)': x.tb||'',
        'Status Gizi': x.status_gizi||'',
        'Pendampingan': x.status_pendampingan||'',
        'Sumber Data': x.sumber_data||'BNBA'
      }));
      const ws2 = XLSX.utils.json_to_sheet(detail);
      ws2['!cols'] = [
        {wch:5},{wch:18},{wch:18},{wch:22},{wch:5},{wch:12},{wch:10},
        {wch:20},{wch:20},{wch:30},{wch:18},{wch:14},{wch:18},{wch:14},
        {wch:10},{wch:10},{wch:14},{wch:18},{wch:12}
      ];
      
      // Sheet 3: Per Kecamatan
      const perKec = {};
      allCases.forEach(x => {
        const k = x.kecamatan || '-';
        if(!perKec[k]) perKec[k] = {total:0, stunting:0, gizi_kurang:0, gizi_buruk:0, ideal:0, damping:0};
        perKec[k].total++;
        if(x.status_gizi === 'Stunting') perKec[k].stunting++;
        if(x.status_gizi === 'Gizi Kurang') perKec[k].gizi_kurang++;
        if(x.status_gizi === 'Gizi Buruk') perKec[k].gizi_buruk++;
        if(x.status_gizi === 'Ideal') perKec[k].ideal++;
        if(x.status_pendampingan !== 'Belum Dikunjungi') perKec[k].damping++;
      });
      const rekKec = Object.entries(perKec).sort((a,b) => b[1].total - a[1].total).map(([kec, d]) => ({
        'Kecamatan': kec,
        'Total Kasus': d.total,
        'Stunting': d.stunting,
        'Gizi Kurang': d.gizi_kurang,
        'Gizi Buruk': d.gizi_buruk,
        'Ideal': d.ideal,
        'Sudah Didampingi': d.damping
      }));
      const ws3 = XLSX.utils.json_to_sheet(rekKec);
      ws3['!cols'] = [{wch:18},{wch:12},{wch:10},{wch:12},{wch:12},{wch:8},{wch:18}];
      
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws1, 'Ringkasan');
      XLSX.utils.book_append_sheet(wb, ws2, 'Detail Kasus');
      XLSX.utils.book_append_sheet(wb, ws3, 'Per Kecamatan');
      
      const fname = 'Laporan_ZStunting_' + new Date().toISOString().slice(0,10) + '.xlsx';
      XLSX.writeFile(wb, fname);
      toast('✅ Excel diunduh: ' + fname, 'success');
    };
    
    // ==== CSV export ====
    window.exportCSVReport = function(){
      const allCases = APP.user.role === 'admin' 
        ? (APP.state.cases||[]) 
        : (APP.state.cases||[]).filter(x => x.team_id === APP.user.teamId);
      const headers = ['No','NIK','No KK','Nama','JK','Tgl Lahir','Usia (bln)','Nama Ibu','Nama Ayah','Alamat','Desa','Kecamatan','Posyandu','HP Ortu','BB','TB','Status Gizi','Pendampingan'];
      const rows = allCases.map((x,i) => [
        i+1, x.nik||'', x.no_kk||'', x.nama||'', x.jk||'', x.tgl_lahir||'', x.usia_bulan||0,
        x.nama_ibu||'', x.nama_ayah||'', x.alamat||'', x.desa||'', x.kecamatan||'',
        x.posyandu||'', x.hp_ortu||'', x.bb||'', x.tb||'', x.status_gizi||'', x.status_pendampingan||''
      ]);
      const csv = [headers, ...rows].map(r => r.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
      const blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Laporan_ZStunting_${new Date().toISOString().slice(0,10)}.csv`;
      a.click(); URL.revokeObjectURL(url);
      toast('✅ CSV diunduh','success');
    };
    
    // ==== Print ====
    window.printReport = function(){
      window.print();
    };
    
    console.log('✅ Patch Laporan aktif');
  }
  
  waitReady();
})();
</script>

  <script>
/* ========== PATCH: IMPORT BNBA SEMUA FORMAT ========== */
(function(){
  function waitReady(){
    if(typeof APP !== 'undefined' && typeof saveState === 'function' && typeof autoAssign === 'function'){
      installMultiImport();
    } else setTimeout(waitReady, 300);
  }
  
  function installMultiImport(){
    // Override renderPengaturan — ubah input file terima semua format
    const origRenderPengaturan = window.renderPengaturan;
    window.renderPengaturan = function(c){
      origRenderPengaturan.call(this, c);
      // Ganti input BNBA agar terima semua format
      const oldInput = document.getElementById('csvBNBA');
      if(oldInput){
        const newInput = document.createElement('input');
        newInput.type = 'file';
        newInput.id = 'csvBNBA';
        newInput.accept = '.csv,.xlsx,.xls,.txt,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv,text/plain';
        oldInput.parentNode.replaceChild(newInput, oldInput);
        // Update label
        const label = newInput.previousElementSibling;
        if(label && label.tagName === 'LABEL'){
          label.textContent = 'File Data BNBA (Excel / CSV / TXT)';
        }
        // Update hint di bawah tombol
        const hint = newInput.parentNode.nextElementSibling;
        if(hint && hint.classList.contains('hint')){
          hint.innerHTML = `<b>Format didukung:</b> Excel (.xlsx, .xls), CSV, TXT<br>
            <b>Kolom yang dibutuhkan (baris pertama header):</b><br>
            <code style="font-size:11px">nik, no_kk, nama, jk, tgl_lahir, usia_bulan, nama_ibu, nama_ayah, alamat, desa, kecamatan, posyandu, hp_ortu, bb, tb, status_gizi</code><br><br>
            💡 <b>Kolom kosong boleh dihilangkan.</b> Sistem akan cocokkan nama kolom otomatis.`;
        }
      }
    };
    
    // Override importBNBA — deteksi tipe file otomatis
    window.importBNBA = async function(){
      const f = document.getElementById('csvBNBA').files[0];
      if(!f){ toast('Pilih file dulu','warning'); return; }
      
      showLoading('Membaca file...');
      try {
        let rows = [];
        const ext = f.name.split('.').pop().toLowerCase();
        
        if(ext === 'csv' || ext === 'txt'){
          // Baca CSV/TXT sebagai teks
          const text = await f.text();
          rows = parseCSV(text);
        } else if(ext === 'xlsx' || ext === 'xls'){
          // Baca Excel via XLSX
          const buf = await f.arrayBuffer();
          const wb = XLSX.read(buf, {type:'array'});
          // Cari sheet yang mengandung kolom "nama" atau "nik"
          let ws = wb.Sheets[wb.SheetNames[0]];
          for(const name of wb.SheetNames){
            const test = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:''});
            if(test.length > 1){
              const hdr = test[0].map(h => String(h||'').toLowerCase().trim());
              if(hdr.includes('nama') || hdr.includes('nik') || hdr.includes('name')){
                ws = wb.Sheets[name];
                break;
              }
            }
          }
          const raw = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
          rows = raw;
        } else {
          hideLoading();
          toast('Format file tidak didukung. Gunakan Excel/CSV.','error');
          return;
        }
        
        if(rows.length < 2){ hideLoading(); toast('File kosong atau tidak ada data','error'); return; }
        
        // Deteksi header (baris pertama yang punya >3 kolom terisi)
        let headerRowIdx = 0;
        for(let i=0; i<Math.min(5, rows.length); i++){
          const filled = (rows[i]||[]).filter(v => String(v||'').trim()).length;
          if(filled >= 3){ headerRowIdx = i; break; }
        }
        const headers = (rows[headerRowIdx]||[]).map(h => String(h||'').toLowerCase().trim().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,''));
        
        // Alias kolom umum (Indonesia & English)
        const alias = {
          'nama_balita':'nama', 'nama_anak':'nama', 'name':'nama', 'nama_lengkap':'nama', 'bayi':'nama', 'balita':'nama',
          'jenis_kelamin':'jk', 'gender':'jk', 'sex':'jk', 'jenis_kel':'jk',
          'tanggal_lahir':'tgl_lahir', 'tgl_lhr':'tgl_lahir', 'birth_date':'tgl_lahir', 'birthdate':'tgl_lahir', 'lahir':'tgl_lahir',
          'umur':'usia_bulan', 'usia':'usia_bulan', 'age':'usia_bulan',
          'ibu':'nama_ibu', 'mother':'nama_ibu', 'nm_ibu':'nama_ibu',
          'ayah':'nama_ayah', 'father':'nama_ayah', 'nm_ayah':'nama_ayah',
          'alamat_lengkap':'alamat', 'address':'alamat',
          'kelurahan':'desa', 'kel/desa':'desa', 'village':'desa',
          'kec':'kecamatan', 'district':'kecamatan',
          'posyandu':'posyandu', 'nama_posyandu':'posyandu',
          'no_hp':'hp_ortu', 'hp':'hp_ortu', 'telepon':'hp_ortu', 'phone':'hp_ortu', 'wa':'hp_ortu', 'no_wa':'hp_ortu',
          'berat_badan':'bb', 'berat':'bb', 'weight':'bb',
          'tinggi_badan':'tb', 'tinggi':'tb', 'height':'tb', 'panjang':'tb',
          'gizi':'status_gizi', 'status':'status_gizi',
          'no_kk':'no_kk', 'kartu_keluarga':'no_kk', 'nkk':'no_kk',
          'nomor_induk':'nik', 'induk':'nik'
        };
        const mapped = headers.map(h => alias[h] || h);
        
        // Cari index kolom
        const idx = {
          nik: mapped.indexOf('nik'),
          no_kk: mapped.indexOf('no_kk'),
          nama: mapped.indexOf('nama'),
          jk: mapped.indexOf('jk'),
          tgl_lahir: mapped.indexOf('tgl_lahir'),
          usia_bulan: mapped.indexOf('usia_bulan'),
          nama_ibu: mapped.indexOf('nama_ibu'),
          nama_ayah: mapped.indexOf('nama_ayah'),
          alamat: mapped.indexOf('alamat'),
          desa: mapped.indexOf('desa'),
          kecamatan: mapped.indexOf('kecamatan'),
          posyandu: mapped.indexOf('posyandu'),
          hp_ortu: mapped.indexOf('hp_ortu'),
          bb: mapped.indexOf('bb'),
          tb: mapped.indexOf('tb'),
          status_gizi: mapped.indexOf('status_gizi')
        };
        
        if(idx.nama === -1){ hideLoading(); toast('Kolom "nama" tidak ditemukan','error'); return; }
        
        // Parse baris jadi object
        const getVal = (row, i) => i >= 0 ? String(row[i]||'').trim() : '';
        
        const cases = [];
        for(let i = headerRowIdx+1; i < rows.length; i++){
          const r = rows[i];
          if(!r) continue;
          const nama = getVal(r, idx.nama);
          if(!nama) continue;
          if(nama.toLowerCase() === 'nama' || nama.toLowerCase().includes('nama balita')) continue;
          
          let jkRaw = getVal(r, idx.jk).toUpperCase().charAt(0);
          const jk = (jkRaw === 'L' || jkRaw === 'P') ? jkRaw : 'L';
          
          let tgl = getVal(r, idx.tgl_lahir);
          // Normalize date
          if(tgl && !tgl.match(/^\d{4}-\d{2}-\d{2}$/)){
            const d = parseDate(tgl);
            if(d) tgl = d;
          }
          
          let usia = parseInt(getVal(r, idx.usia_bulan)) || 0;
          if(!usia && tgl){
            const d = new Date(tgl);
            const n = new Date();
            usia = Math.max(0, (n.getFullYear()-d.getFullYear())*12 + (n.getMonth()-d.getMonth()));
          }
          
          let kec = getVal(r, idx.kecamatan).toUpperCase().trim();
          
          cases.push({
            id: 'CS' + Date.now() + '_' + i,
            nik: getVal(r, idx.nik) || '',
            no_kk: getVal(r, idx.no_kk) || '',
            nama: nama,
            jk: jk,
            tgl_lahir: tgl || '',
            usia_bulan: usia,
            nama_ibu: getVal(r, idx.nama_ibu) || '',
            nama_ayah: getVal(r, idx.nama_ayah) || '',
            alamat: getVal(r, idx.alamat) || '',
            desa: getVal(r, idx.desa) || '',
            kecamatan: kec,
            posyandu: getVal(r, idx.posyandu) || '',
            hp_ortu: normalizeHP(getVal(r, idx.hp_ortu)),
            bb: parseFloat(getVal(r, idx.bb)) || 0,
            tb: parseFloat(getVal(r, idx.tb)) || 0,
            status_gizi: normalizeGizi(getVal(r, idx.status_gizi)),
            status_pendampingan: 'Belum Dikunjungi',
            team_id: null,
            riwayat: [],
            tgl_ukur_terakhir: new Date().toISOString().slice(0,10)
          });
        }
        
        hideLoading();
        if(cases.length === 0){ toast('Tidak ada data valid','error'); return; }
        
        if(!confirm(`Ditemukan ${cases.length} kasus dari file "${f.name}".\n\nImport sekarang?\nData lama (${(APP.state.cases||[]).length}) akan DIGANTI.`)) return;
        
        APP.state.cases = cases;
        autoAssign();
        saveState();
        toast(`✅ ${cases.length} kasus diimport + auto-assign ke Tim`,'success');
        updateBadge();
        showView('kasus', document.querySelector('.nav-item[data-view="kasus"]'));
      } catch(e){
        hideLoading();
        console.error(e);
        toast('❌ Gagal baca file: ' + e.message,'error');
      }
    };
    
    // Parser CSV
    function parseCSV(text){
      const lines = text.split(/\r?\n/).filter(l => l.trim());
      const delim = detectDelimiter(text);
      return lines.map(line => {
        const vals = []; let cur = ''; let inQ = false;
        for(let i=0; i<line.length; i++){
          const ch = line[i];
          if(ch === '"'){ if(inQ && line[i+1]==='"'){ cur+='"'; i++; } else inQ = !inQ; }
          else if(ch === delim && !inQ){ vals.push(cur); cur = ''; }
          else cur += ch;
        }
        vals.push(cur);
        return vals;
      });
    }
    
    function detectDelimiter(text){
      const firstLine = text.split(/\r?\n/)[0] || '';
      const semis = (firstLine.match(/;/g)||[]).length;
      const commas = (firstLine.match(/,/g)||[]).length;
      const tabs = (firstLine.match(/\t/g)||[]).length;
      if(tabs > commas && tabs > semis) return '\t';
      if(semis > commas) return ';';
      return ',';
    }
    
    function parseDate(s){
      s = String(s||'').trim();
      // Format: 10/05/2023 atau 10-05-2023
      let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if(m){
        let dd = parseInt(m[1]), mm = parseInt(m[2]), yyyy = m[3];
        // Kalau bulan > 12, tukar dd & mm
        if(mm > 12){ const t = dd; dd = mm; mm = t; }
        return `${yyyy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
      }
      // Format: 2023/05/10
      m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
      if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
      // Excel serial number
      if(/^\d{5}$/.test(s)){
        const excelEpoch = new Date(1899, 11, 30);
        const d = new Date(excelEpoch.getTime() + parseInt(s) * 86400000);
        if(!isNaN(d.getTime())) return d.toISOString().slice(0,10);
      }
      return '';
    }
    
    function normalizeHP(hp){
      hp = String(hp||'').replace(/[^\d+]/g,'');
      if(hp.startsWith('+62')) hp = '0' + hp.slice(3);
      if(hp.startsWith('62')) hp = '0' + hp.slice(2);
      return hp;
    }
    
    function normalizeGizi(g){
      g = String(g||'').toLowerCase().trim();
      if(g.includes('stunting') || g.includes('pendek') || g.includes('stunt')) return 'Stunting';
      if(g.includes('buruk') || g.includes('severe')) return 'Gizi Buruk';
      if(g.includes('kurang') || g.includes('wasted') || g.includes('underweight')) return 'Gizi Kurang';
      if(g.includes('ideal') || g.includes('normal') || g.includes('baik') || g.includes('sehat')) return 'Ideal';
      return 'Ideal';
    }
    
    console.log('✅ Patch Import Multi-Format aktif');
  }
  
  waitReady();
})();
</script>
  <script>
/* ========== PATCH: DEFAULT DESA/KECAMATAN UNTUK IMPORT BNBA ========== */
(function(){
  function waitReady(){
    if(typeof APP !== 'undefined' && typeof saveState === 'function' && typeof autoAssign === 'function'){
      installDefaultWilayah();
    } else setTimeout(waitReady, 300);
  }
  
  function installDefaultWilayah(){

    const origRenderPengaturan = window.renderPengaturan;
    window.renderPengaturan = function(c){
      origRenderPengaturan.call(this, c);
      
      // Cari card import BNBA
      const cards = c.querySelectorAll('.card');
      let bnbaCard = null;
      cards.forEach(card => {
        if(card.innerHTML.includes('Import Kasus BNBA')) bnbaCard = card;
      });
      if(!bnbaCard) return;
      
      // Ambil daftar desa dari data TPK
      const tpk = APP.state.tpk || [];
      const desaPerKec = {};
      tpk.forEach(t => {
        if(!desaPerKec[t.kecamatan]) desaPerKec[t.kecamatan] = new Set();
        desaPerKec[t.kecamatan].add(t.desa);
      });
      const kecList = Object.keys(desaPerKec).sort();
      
      // Tambah form default wilayah SEBELUM input file
      const hintDiv = bnbaCard.querySelector('.hint');
      const inputGroup = bnbaCard.querySelector('.form-group');
      if(!inputGroup) return;
      
      const defaultDiv = document.createElement('div');
      defaultDiv.style.cssText = 'background:#e0f2fe;padding:12px;border-radius:10px;margin-bottom:14px;font-size:12.5px;color:#0369a1;line-height:1.6';
      defaultDiv.innerHTML = `
        <b>📍 Wilayah Default</b><br>
        <span style="font-size:11.5px">Jika file BNBA tidak punya kolom desa/kecamatan, gunakan wilayah ini:</span>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
          <select id="defaultKec" style="padding:8px;border-radius:6px;border:1.5px solid #94a3b8;font-size:13px;background:#fff" onchange="updateDefaultDesa()">
            <option value="">- Pilih Kecamatan -</option>
            ${kecList.map(k => `<option value="${k}">${k}</option>`).join('')}
          </select>
          <select id="defaultDesa" style="padding:8px;border-radius:6px;border:1.5px solid #94a3b8;font-size:13px;background:#fff">
            <option value="">- Pilih Desa -</option>
          </select>
        </div>
      `;
      
      // Sisipkan setelah form-group pertama
      inputGroup.parentNode.insertBefore(defaultDiv, inputGroup);
      
      // Simpan data desa per kecamatan untuk filter
      window._desaPerKec = desaPerKec;
      
      // Update hint
      if(hintDiv){
        hintDiv.innerHTML = `<b>Format didukung:</b> Excel (.xlsx, .xls), CSV, TXT<br>
          <b>Kolom opsional:</b> <code style="font-size:11px">nik, no_kk, nama, jk, tgl_lahir, usia_bulan, nama_ibu, nama_ayah, alamat, desa, kecamatan, posyandu, hp_ortu, bb, tb, status_gizi</code><br><br>
          💡 <b>Kalau file tidak punya kolom desa/kecamatan, pilih Wilayah Default di atas.</b><br>
          💡 Sistem otomatis cocokkan nama kolom (Nama Balita, JK, Tgl Lahir, dll).`;
      }
    };
    
    // Update dropdown desa saat kecamatan dipilih
    window.updateDefaultDesa = function(){
      const kec = document.getElementById('defaultKec').value;
      const desaSel = document.getElementById('defaultDesa');
      if(!desaSel) return;
      if(!kec || !window._desaPerKec || !window._desaPerKec[kec]){
        desaSel.innerHTML = '<option value="">- Pilih Desa -</option>';
        return;
      }
      const list = Array.from(window._desaPerKec[kec]).sort();
      desaSel.innerHTML = '<option value="">- Pilih Desa -</option>' + 
        list.map(d => `<option value="${d}">${d}</option>`).join('');
    };
    
    // Override importBNBA — pakai default wilayah kalau kolom kosong
    const origImport = window.importBNBA;
    window.importBNBA = async function(){
      const f = document.getElementById('csvBNBA')?.files[0];
      if(!f){ toast('Pilih file dulu','warning'); return; }
      
      // Ambil default wilayah
      const defaultKec = document.getElementById('defaultKec')?.value || '';
      const defaultDesa = document.getElementById('defaultDesa')?.value || '';
      
      if(defaultKec && !defaultDesa){
        if(!confirm('Kecamatan default sudah dipilih tapi Desa belum.\n\nLanjutkan tanpa desa default?')) return;
      }
      
      // Simpan default ke global agar dibaca oleh importBNBA asli
      window._defaultKec = defaultKec;
      window._defaultDesa = defaultDesa;
      
      // Panggil import asli — kita patch perilakunya dengan monkey-patch sementara
      await origImport.call(this);
    };
    
    // Monkey-patch parse logic: intercept setelah parse
    // Kita perlu intercept autoAssign agar kasus tanpa team_id tetap di-assign via default
    const origAutoAssign = window.autoAssign;
    window.autoAssign = function(){
      // Jalankan yang asli dulu
      origAutoAssign.call(this);
      
      // Fix cases yang belum punya team_id pakai default wilayah
      const defaultKec = window._defaultKec || '';
      const defaultDesa = window._defaultDesa || '';
      if(!defaultKec && !defaultDesa) return;
      
      const tpk = APP.state.tpk || [];
      let fixed = 0;
      
      (APP.state.cases||[]).forEach(c => {
        // Kalau belum punya team_id, coba pakai default
        if(c.team_id) return;
        
        // Isi kecamatan/desa kalau kosong
        if(!c.kecamatan && defaultKec) c.kecamatan = defaultKec;
        if(!c.desa && defaultDesa) c.desa = defaultDesa;
        
        // Cari tim yang cocok
        const kk = (c.kecamatan||'').toUpperCase();
        const kd = (c.desa||'').toUpperCase();
        if(!kk) return;
        
        // Prioritas: desa exact → desa normalized → kecamatan only
        let pool = tpk.filter(t => t.kecamatan === kk && t.desa.toLowerCase() === kd.toLowerCase());
        if(!pool.length) pool = tpk.filter(t => t.kecamatan === kk && t.desa.toUpperCase().replace(/[^A-Z0-9]/g,'') === kd.replace(/[^A-Z0-9]/g,''));
        if(!pool.length) pool = tpk.filter(t => t.kecamatan === kk);
        if(!pool.length) return;
        
        // Round robin sederhana
        const counters = {};
        pool.forEach(t => {
          counters[t.teamId] = (APP.state.cases||[]).filter(c2 => c2.team_id === t.teamId).length;
        });
        pool.sort((a,b) => counters[a.teamId] - counters[b.teamId]);
        c.team_id = pool[0].teamId;
        fixed++;
      });
      
      if(fixed > 0){
        console.log(`✅ ${fixed} kasus di-assign ulang pakai wilayah default`);
      }
    };
    
    // Override saveEdit — alamat tidak lagi wajib
    const origSaveEdit = window.saveEdit;
    window.saveEdit = function(){
      // Cek dulu kalau alamat kosong — kasih peringatan tapi tetap lanjut
      const alamatEl = document.getElementById('e_alamat');
      if(alamatEl && !alamatEl.value.trim()){
        if(!confirm('Alamat masih kosong.\n\nLanjutkan simpan tanpa alamat?')) return;
        // Isi alamat default supaya tidak error
        alamatEl.value = '-';
      }
      return origSaveEdit.call(this);
    };
    
    console.log('✅ Patch Default Wilayah aktif');
  }
  
  waitReady();
})();

<script>
/* ========== PATCH BUNDLE: 4 FITUR KRITIS ========== */
(function(){
  const KECAMATAN_COORDS = {
    'ARUNGKEKE':[-5.5500,119.7333],'BANGKALA':[-5.4833,119.6333],'BANGKALA BARAT':[-5.4667,119.5833],
    'BATANG':[-5.5333,119.6667],'BINAMU':[-5.6167,119.7167],'BONTORAMBA':[-5.6000,119.6500],
    'KELARA':[-5.5667,119.7500],'RUMBIA':[-5.4833,119.7833],'TAMALATEA':[-5.5833,119.6833],
    'TAROWANG':[-5.5500,119.8000],'TURATEA':[-5.5167,119.7167]
  };
  let _photoCache = [];
  let _gpsCache = null;
  let _mapInstance = null;

  // ==== AUTO COMPRESS FOTO ====
  function compressImage(file, maxSize = 800, quality = 0.65){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          if(w > h){ h = h * (maxSize/w); w = maxSize; } else { w = w * (maxSize/h); h = maxSize; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ==== GET GPS ====
  function getGPS(){
    return new Promise((resolve, reject) => {
      if(!navigator.geolocation){ reject(new Error('GPS tidak didukung')); return; }
      navigator.geolocation.getCurrentPosition(
        pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy }),
        err => reject(err),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    });
  }

  // ==== OVERRIDE openKunjungan — TAMBAH FOTO + GPS ====
  function patchKunjungan(){
    const origOpenKunjungan = window.openKunjungan;
    window.openKunjungan = function(id){
      origOpenKunjungan.call(this, id);
      setTimeout(injectPhotoGPS, 100);
    };

    function injectPhotoGPS(){
      _photoCache = [];
      _gpsCache = null;
      const body = document.getElementById('kunjunganBody');
      if(!body) return;
      const x = APP.currentKunjungan;
      
      // Cari titik sisip: setelah textarea catatan atau sebelum penutup
      const catatan = body.querySelector('#k_cat');
      const targetAfter = catatan ? catatan.closest('.form-group') : body.querySelector('.form-grid');
      
      const photoSection = document.createElement('div');
      photoSection.className = 'form-group full';
      photoSection.innerHTML = `
        <label style="color:var(--primary);font-weight:800">📸 DOKUMENTASI KUNJUNGAN</label>
        <div style="background:#f0f9ff;padding:12px;border-radius:10px;margin-bottom:10px;font-size:12px;color:#0369a1;line-height:1.5">
          <b>Bukti kader turun ke lapangan.</b> Foto otomatis embed GPS & timestamp.
        </div>
        <input type="file" id="k_photos" accept="image/*" capture="environment" multiple style="width:100%;padding:10px;border:1.5px dashed #0284c7;border-radius:10px;background:#fff;cursor:pointer">
        <div class="photo-preview" id="photoPreview"></div>
        <div class="gps-status gps-wait" id="gpsStatus">
          📡 <span id="gpsText">Sedang mendeteksi lokasi GPS...</span>
          <button type="button" style="margin-left:auto;padding:4px 10px;background:#fff;border:1px solid #94a3b8;border-radius:6px;font-size:11px;font-weight:600" onclick="window._retryGPS()">🔄 Ulangi</button>
        </div>
      `;
      
      if(targetAfter && targetAfter.parentNode){
        targetAfter.parentNode.insertBefore(photoSection, targetAfter.nextSibling);
      } else {
        body.appendChild(photoSection);
      }
      
      // Event handlers
      document.getElementById('k_photos').addEventListener('change', async e => {
        const files = Array.from(e.target.files).slice(0, 5);
        _photoCache = [];
        const preview = document.getElementById('photoPreview');
        preview.innerHTML = '';
        for(const f of files){
          try {
            const compressed = await compressImage(f);
            _photoCache.push(compressed);
            const img = document.createElement('img');
            img.src = compressed;
            img.onclick = () => window.viewPhoto(compressed);
            preview.appendChild(img);
          } catch(err){ console.warn('Compress err:', err); }
        }
        toast(`📸 ${_photoCache.length} foto siap`, 'success');
      });
      
      // Auto get GPS
      window._retryGPS = async () => {
        const statusEl = document.getElementById('gpsStatus');
        const textEl = document.getElementById('gpsText');
        statusEl.className = 'gps-status gps-wait';
        textEl.textContent = 'Sedang mendeteksi lokasi GPS...';
        try {
          const pos = await getGPS();
          _gpsCache = pos;
          statusEl.className = 'gps-status gps-ok';
          textEl.innerHTML = `✅ GPS terdeteksi: <b>${pos.lat.toFixed(6)}, ${pos.lng.toFixed(6)}</b> (±${Math.round(pos.acc)}m)`;
        } catch(err){
          statusEl.className = 'gps-status gps-err';
          textEl.textContent = '❌ GPS gagal: ' + (err.message || 'Izin lokasi ditolak');
        }
      };
      window._retryGPS();
    }

    window.viewPhoto = function(src){
      document.getElementById('photoViewerImg').src = src;
      document.getElementById('photoViewer').classList.add('show');
    };
  }

  // ==== OVERRIDE saveKunjungan — SIMPAN FOTO + GPS ====
  function patchSave(){
    const origSave = window.saveKunjungan;
    window.saveKunjungan = function(){
      const x = APP.currentKunjungan;
      if(!x) return origSave.call(this);
      
      // Panggil save asli
      const beforeCount = (x.riwayat||[]).length;
      origSave.call(this);
      const afterCount = (x.riwayat||[]).length;
      
      // Kalau ada riwayat baru, attach foto + GPS + status verifikasi
      if(afterCount > beforeCount){
        const r = x.riwayat[x.riwayat.length - 1];
        r.foto = _photoCache.slice();
        r.gps = _gpsCache ? {..._gpsCache} : null;
        r.inputBy = APP.user.username;
        r.inputAt = new Date().toISOString();
        r.statusVerifikasi = 'Menunggu Verifikasi';
        
        // Set ke kasus juga
        x.status_verifikasi = 'Menunggu Verifikasi';
        
        saveState();
        toast(`✅ Kunjungan disimpan + ${r.foto.length} foto${r.gps?' + GPS':''}`,'success');
        updateBadge();
        const active = document.querySelector('.nav-item.active')?.dataset.view || 'kasus';
        showView(active, document.querySelector('.nav-item.active'));
      }
    };
  }

  // ==== TAMBAH FITUR VERIFIKASI ====
  function patchDetail(){
    const origDetail = window.openDetail;
    window.openDetail = function(id){
      origDetail.call(this, id);
      setTimeout(() => {
        const body = document.getElementById('detailBody');
        const x = APP.currentDetail;
        if(!body || !x) return;
        
        const isAdmin = APP.user.role === 'admin';
        const statusV = x.status_verifikasi || 'Belum Dikunjungi';
        
        // Tambah badge status verifikasi
        const headerBox = body.querySelector('div[style*="background:var(--primary-light)"]');
        if(headerBox){
          const badge = document.createElement('div');
          badge.style.cssText = 'margin-top:10px;padding:8px 12px;border-radius:8px;font-size:12.5px;font-weight:700';
          if(statusV === 'Terverifikasi'){
            badge.style.cssText += ';background:#dcfce7;color:#16a34a';
            badge.innerHTML = '✅ TERVERIFIKASI oleh ' + (x.verifikasiBy || 'Admin');
          } else if(statusV === 'Ditolak'){
            badge.style.cssText += ';background:#fee2e2;color:#dc2626';
            badge.innerHTML = '❌ DITOLAK: ' + (x.alasanTolak || '-');
          } else if(x.riwayat && x.riwayat.length > 0){
            badge.style.cssText += ';background:#fef3c7;color:#92400e';
            badge.innerHTML = '⏳ MENUNGGU VERIFIKASI';
          } else {
            badge.style.cssText += ';background:#f1f5f9;color:#64748b';
            badge.innerHTML = '⚪ Belum ada kunjungan';
          }
          headerBox.appendChild(badge);
        }
        
        // Tampilkan foto + GPS di riwayat
        const timeline = body.querySelector('.timeline');
        if(timeline && x.riwayat){
          x.riwayat.slice().reverse().forEach((r, idx) => {
            if(r.foto && r.foto.length > 0){
              const tlItem = timeline.children[idx];
              if(tlItem){
                const photoWrap = document.createElement('div');
                photoWrap.className = 'photo-preview';
                photoWrap.style.marginTop = '8px';
                photoWrap.innerHTML = r.foto.map(f => `<img src="${f}" onclick="window.viewPhoto('${f.substring(0,30)}...')" data-photo="${f.replace(/"/g,'&quot;')}">`).join('');
                // Attach click dengan data penuh
                tlItem.appendChild(photoWrap);
                photoWrap.querySelectorAll('img').forEach(img => {
                  img.onclick = () => window.viewPhoto(img.dataset.photo);
                });
                if(r.gps){
                  const gpsInfo = document.createElement('div');
                  gpsInfo.style.cssText = 'font-size:11px;color:#16a34a;margin-top:6px;display:flex;align-items:center;gap:4px';
                  gpsInfo.innerHTML = `📍 <a href="https://maps.google.com/?q=${r.gps.lat},${r.gps.lng}" target="_blank" style="color:#16a34a;text-decoration:none">${r.gps.lat.toFixed(5)}, ${r.gps.lng.toFixed(5)}</a>`;
                  tlItem.appendChild(gpsInfo);
                }
              }
            }
          });
        }
        
        // Tambah tombol verifikasi untuk admin
        if(isAdmin && x.riwayat && x.riwayat.length > 0 && statusV === 'Menunggu Verifikasi'){
          const footer = document.getElementById('detailFooter');
          if(footer){
            const verifyBtn = document.createElement('button');
            verifyBtn.className = 'btn btn-success';
            verifyBtn.style.cssText = 'background:linear-gradient(135deg,#16a34a,#059669);color:#fff';
            verifyBtn.innerHTML = '✅ Verifikasi';
            verifyBtn.onclick = () => verifyCase(x.id, 'Terverifikasi');
            
            const rejectBtn = document.createElement('button');
            rejectBtn.className = 'btn btn-danger';
            rejectBtn.innerHTML = '❌ Tolak';
            rejectBtn.onclick = () => verifyCase(x.id, 'Ditolak');
            
            footer.insertBefore(rejectBtn, footer.lastElementChild);
            footer.insertBefore(verifyBtn, footer.lastElementChild);
          }
        }
      }, 200);
    };
    
    window.verifyCase = function(id, status){
      const x = (APP.state.cases||[]).find(c => c.id === id);
      if(!x) return;
      if(status === 'Terverifikasi'){
        x.status_verifikasi = 'Terverifikasi';
        x.verifikasiBy = APP.user.nama;
        x.verifikasiAt = new Date().toISOString();
        toast('✅ Kasus terverifikasi','success');
      } else {
        const alasan = prompt('Alasan penolakan:');
        if(!alasan) return;
        x.status_verifikasi = 'Ditolak';
        x.alasanTolak = alasan;
        toast('❌ Kasus ditolak','warning');
      }
      saveState();
      closeModal('modalDetail');
      const active = document.querySelector('.nav-item.active')?.dataset.view || 'kasus';
      showView(active, document.querySelector('.nav-item.active'));
    };
  }

  // ==== MENU BARU: DASHBOARD EKSEKUTIF + PETA ====
  function addMenus(){
    const nav = document.querySelector('.nav');
    if(!nav || document.getElementById('navExec')) return;
    
    const isAdmin = APP.user && APP.user.role === 'admin';
    if(!isAdmin) return;
    
    // Sisipkan setelah "Progress Tim" atau "Semua TPK"
    const ref = nav.querySelector('[data-view="progress"]') || nav.querySelector('[data-view="tpk"]');
    
    const btnExec = document.createElement('button');
    btnExec.className = 'nav-item';
    btnExec.id = 'navExec';
    btnExec.innerHTML = '<span class="ic">🎯</span> Dashboard Eksekutif';
    btnExec.onclick = () => {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      btnExec.classList.add('active');
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('pageTitle').textContent = 'Dashboard Eksekutif';
      document.getElementById('pageCrumb').textContent = 'Untuk Pimpinan';
      renderExec(document.getElementById('content'));
    };
    
    const btnMap = document.createElement('button');
    btnMap.className = 'nav-item';
    btnMap.id = 'navMap';
    btnMap.innerHTML = '<span class="ic">🗺️</span> Peta Live TPK';
    btnMap.onclick = () => {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      btnMap.classList.add('active');
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('pageTitle').textContent = 'Peta Live TPK';
      document.getElementById('pageCrumb').textContent = 'Sebaran Kader';
      renderLiveMap(document.getElementById('content'));
    };
    
    if(ref && ref.nextSibling){
      ref.parentNode.insertBefore(btnExec, ref.nextSibling);
      btnExec.parentNode.insertBefore(btnMap, btnExec.nextSibling);
    } else {
      nav.appendChild(btnExec);
      nav.appendChild(btnMap);
    }
  }

  // ==== RENDER DASHBOARD EKSEKUTIF ====
  function renderExec(c){

    const stunting = cases.filter(x => x.status_gizi === 'Stunting').length;
    const fotos = cases.reduce((sum, x) => sum + (x.riwayat||[]).reduce((s,r)=>s+(r.foto?.length||0),0), 0);
    const gpsCount = cases.reduce((sum, x) => sum + (x.riwayat||[]).filter(r=>r.gps).length, 0);
    const withHP = cases.filter(x => x.hp_ortu && x.hp_ortu.length > 8).length;
    
    const perKec = {};

          <div class="exec-stat"><div class="num">${visited.toLocaleString('id-ID')}</div><div class="lbl">Sudah Dikunjungi</div></div>
          <div class="exec-stat"><div class="num">${verified.toLocaleString('id-ID')}</div><div class="lbl">Terverifikasi</div></div>
          <div class="exec-stat"><div class="num">${stunting.toLocaleString('id-ID')}</div><div class="lbl">Kasus Stunting</div></div>

          </div>
        </div>
        <div class="card">
          <div class="card-header"><div><div class="card-title">✅ Progress Verifikasi</div></div></div>
          <div style="text-align:center;padding:16px 0">
            <div style="font-size:52px;font-weight:900;background:linear-gradient(135deg,#16a34a,#059669);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">${verifyPct}%</div>
            <div style="font-size:13px;color:#64748b;margin-top:4px">${verified} terverifikasi dari ${visited} kunjungan</div>
            <div class="pbar" style="height:12px;margin-top:16px"><div class="pbar-fill" style="width:${verifyPct}%;background:#16a34a"></div></div>
            ${pending > 0 ? `<div style="font-size:12px;color:#92400e;margin-top:12px">⏳ ${pending} menunggu verifikasi</div>` : ''}
          </div>
        </div>
      </div>
      
      <div class="card">
        <div class="card-header"><div><div class="card-title">🗺️ Progress per Kecamatan</div></div></div>
        <div style="display:grid;gap:10px">
          ${kecSorted.slice(0, 11).map(([kec, d]) => {
            const pct = d.total ? Math.round(d.visited/d.total*100) : 0;

                <b>${kec}</b>

              <div class="pbar" style="height:10px"><div class="pbar-fill" style="width:${pct}%;background:${pct>50?'#16a34a':(pct>20?'#f59e0b':'#dc2626')}"></div></div>

  // ==== RENDER PETA LIVE ====
  function renderLiveMap(c){
    const cases = APP.state.cases || [];
    const tpk = APP.state.tpk || [];
    const perKec = {};
    
    cases.forEach(x => {
      const k = (x.kecamatan || '').toUpperCase();
      if(!k) return;
      if(!perKec[k]) perKec[k] = {total:0, visited:0, stunting:0, verified:0, teams:0};
      perKec[k].total++;
      if(x.riwayat && x.riwayat.length > 0) perKec[k].visited++;
      if(x.status_gizi === 'Stunting') perKec[k].stunting++;
      if(x.status_verifikasi === 'Terverifikasi') perKec[k].verified++;
    });
    tpk.forEach(t => {
      const k = t.kecamatan;
      if(!perKec[k]) perKec[k] = {total:0, visited:0, stunting:0, verified:0, teams:0};
      perKec[k].teams++;
    });
    
    c.innerHTML = `
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">🗺️ Peta Live Sebaran Kader & Kasus</div>
            <div class="card-sub">Titik di peta = pusat kecamatan · warna = progress</div>
          </div>
        </div>
        <div id="liveMap"></div>
        <div class="map-legend">
          <span><div class="map-dot" style="background:#16a34a"></div> Progress &gt;50% (Baik)</span>
          <span><div class="map-dot" style="background:#f59e0b"></div> Progress 20-50% (Sedang)</span>
          <span><div class="map-dot" style="background:#dc2626"></div> Progress &lt;20% (Perlu Perhatian)</span>
          <span><div class="map-dot" style="background:#0284c7"></div> Belum ada data</span>
        </div>
      </div>
      
      <div class="card">
        <div class="card-header"><div><div class="card-title">📊 Data per Kecamatan</div></div></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Kecamatan</th><th>Tim TPK</th><th>Total Kasus</th><th>Dikunjungi</th><th>Progress</th><th>Terverifikasi</th></tr></thead>
            <tbody>
              ${Object.entries(perKec).sort((a,b)=>b[1].total-a[1].total).map(([kec,d]) => {
                const pct = d.total ? Math.round(d.visited/d.total*100) : 0;
                return `<tr>
                  <td><b>${kec}</b></td>
                  <td>${d.teams} tim</td>
                  <td>${d.total}</td>
                  <td>${d.visited}</td>
                  <td><span style="color:${pct>50?'#16a34a':(pct>20?'#f59e0b':'#dc2626')};font-weight:700">${pct}%</span></td>
                  <td>${d.verified}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
    
    // Init Leaflet peta
    setTimeout(() => {
      const mapEl = document.getElementById('liveMap');
      if(!mapEl || typeof L === 'undefined') return;
      
      // Destroy old map
      if(_mapInstance){ try { _mapInstance.remove(); } catch(e){} }
      
      _mapInstance = L.map('liveMap').setView([-5.55, 119.70], 10);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap', maxZoom: 18
      }).addTo(_mapInstance);
      
      Object.entries(perKec).forEach(([kec, d]) => {
        const coords = KECAMATAN_COORDS[kec];
        if(!coords) return;
        const pct = d.total ? Math.round(d.visited/d.total*100) : 0;
        const color = pct > 50 ? '#16a34a' : (pct > 20 ? '#f59e0b' : (d.total > 0 ? '#dc2626' : '#0284c7'));
        const radius = Math.min(40, 10 + Math.sqrt(d.total) * 2);
        
        L.circleMarker(coords, {
          radius: radius, fillColor: color, color: '#fff', weight: 3,
          opacity: 1, fillOpacity: 0.85
        }).addTo(_mapInstance).bindPopup(`
          <div style="font-family:system-ui;font-size:13px;min-width:180px">
            <div style="font-weight:800;font-size:15px;color:#0f172a;margin-bottom:8px">${kec}</div>
            <div style="display:grid;grid-template-columns:1fr auto;gap:4px;font-size:12.5px">
              <span>Tim TPK:</span><b>${d.teams} tim</b>
              <span>Total Kasus:</span><b>${d.total}</b>
              <span>Dikunjungi:</span><b>${d.visited}</b>
              <span>Terverifikasi:</span><b>${d.verified}</b>
              <span>Progress:</span><b style="color:${color}">${pct}%</b>
            </div>
          </div>
        `);
      });
    }, 300);
  }

  // ==== INSTALL ALL PATCHES ====
  function installAll(){
    if(typeof APP === 'undefined' || typeof showView === 'undefined'){ setTimeout(installAll, 300); return; }
    
    // Tunggu user login dulu
    if(!APP.user){ setTimeout(installAll, 300); return; }
    
    // Sudah login — install
    patchKunjungan();
    patchSave();
    patchDetail();
    addMenus();
    
    console.log('✅ Patch Bundle (Foto+GPS, Verifikasi, Dashboard Eksekutif, Peta Live) aktif');
  }
  
  installAll();
  
  // Re-check menu saat user ganti login
  const checkInterval = setInterval(() => {
    if(APP.user && !document.getElementById('navExec')){
      addMenus();
    }
  }, 2000);
})();
</script>
