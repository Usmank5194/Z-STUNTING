<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
:root{--primary:#0284c7;--primary-dark:#0369a1;--primary-light:#e0f2fe;--navy:#0f172a;--danger:#dc2626;--danger-light:#fee2e2;--warning:#f59e0b;--warning-light:#fef3c7;--info:#0891b2;--info-light:#cffafe;--success:#16a34a;--success-light:#dcfce7;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;--gray-700:#374151;--gray-900:#111827}
body{background:var(--gray-50);color:var(--gray-900);font-size:14px;line-height:1.5}

#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0284c7,#0f172a);padding:20px}

.login-logo{text-align:center;margin-bottom:20px}
.login-logo img{max-width:170px;width:100%;height:auto;margin-bottom:12px;filter:drop-shadow(0 8px 20px rgba(2,132,199,.4))}
.login-tagline{font-size:12.5px;font-weight:700;color:var(--primary);line-height:1.45;padding:0 4px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-weight:700;margin-bottom:6px;font-size:12.5px;color:var(--gray-700);letter-spacing:.2px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;border:1.5px solid var(--gray-300);border-radius:10px;outline:none;font-size:14px;background:linear-gradient(180deg,#fff,#f8fafc);transition:.2s;box-shadow:0 1px 3px rgba(15,23,42,.04)}

.form-group select{background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%230284c7' stroke-width='3'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 14px center;padding-right:40px;appearance:none;-webkit-appearance:none;cursor:pointer}
.pwd-wrap{position:relative}
.pwd-wrap input{padding-right:44px}

.btn-primary:hover{background:linear-gradient(135deg,#0369a1,#075985)}
.login-note{text-align:center;margin-top:16px;font-size:12px;color:var(--gray-500)}
.login-quote{text-align:center;margin-top:16px;padding-top:14px;border-top:1px dashed var(--gray-200);font-size:11.5px;color:var(--primary);font-style:italic;font-weight:600;line-height:1.5}
#appView{display:none}.app-layout{display:flex;min-height:100vh}
.sidebar{width:260px;background:#fff;border-right:1px solid var(--gray-200);position:fixed;height:100vh;overflow-y:auto;z-index:50;transition:.3s}

.sidebar-header .logo{display:flex;align-items:center;gap:10px}

.main-content{margin-left:260px;flex:1;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid var(--gray-200);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;flex-wrap:wrap;gap:8px}

.sync-status{font-size:11px;padding:5px 10px;border-radius:20px;background:var(--gray-100);color:var(--gray-500);display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.sync-status.online{background:var(--success-light);color:var(--success)}
.sync-status.syncing{background:var(--info-light);color:var(--info)}

.content{padding:20px 24px}
.btn{padding:9px 16px;border-radius:10px;border:none;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 3px rgba(15,23,42,.08)}

.btn-sm{padding:6px 11px;font-size:12px}
.btn-primary-solid{background:linear-gradient(135deg,#0284c7,#0369a1);color:#fff}
.btn-outline{background:#fff;border:1.5px solid var(--gray-300);color:var(--gray-700)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);background:#f0f9ff}
.btn-danger{background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff}
.btn-warning{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.btn-info{background:linear-gradient(135deg,#0891b2,#0e7490);color:#fff}
.btn-success{background:linear-gradient(135deg,#16a34a,#059669);color:#fff}
.btn-wa{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:linear-gradient(180deg,#fff,#f8fafc);border-radius:12px;padding:16px;border:1px solid var(--gray-200);transition:.2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(2,132,199,.1);border-color:#bae6fd}
.stat-card .icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:8px}
.stat-card .label{font-size:11.5px;color:var(--gray-500);font-weight:500}
.stat-card .value{font-size:24px;font-weight:700;margin-top:2px}
.stat-card .sub{font-size:11px;color:var(--gray-500);margin-top:3px}
.card{background:#fff;border-radius:12px;border:1px solid var(--gray-200);padding:18px;margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--gray-100);flex-wrap:wrap;gap:10px}
.card-title{font-size:15px;font-weight:700}.card-sub{font-size:12px;color:var(--gray-500);margin-top:2px}
.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--gray-200);box-shadow:0 1px 3px rgba(15,23,42,.04)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:linear-gradient(180deg,#f1f5f9,#e2e8f0)}
th{padding:10px 12px;text-align:left;font-weight:800;color:var(--gray-700);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;border-bottom:1px solid var(--gray-200)}
td{padding:10px 12px;border-bottom:1px solid var(--gray-100);vertical-align:middle}
tbody tr{transition:.15s}
tbody tr:hover{background:#f0f9ff}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.badge-danger{background:var(--danger-light);color:var(--danger)}
.badge-warning{background:var(--warning-light);color:#92400e}

.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:12px;background:#f8fafc;border-radius:12px;border:1px solid var(--gray-200)}

.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--gray-500);flex-wrap:wrap;gap:10px}

.pagination button{padding:6px 11px;border:1px solid var(--gray-300);background:#fff;border-radius:6px;font-size:12.5px}
.pagination button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pagination button:disabled{opacity:.4}
.pbar{height:8px;background:var(--gray-200);border-radius:10px;overflow:hidden;margin-top:6px}
.pbar-fill{height:100%;background:linear-gradient(90deg,#0284c7,#0891b2);border-radius:10px;transition:.3s}
.pbar-fill.danger{background:linear-gradient(90deg,#dc2626,#b91c1c)}
.pbar-fill.warning{background:linear-gradient(90deg,#f59e0b,#d97706)}
.pbar-fill.success{background:linear-gradient(90deg,#16a34a,#059669)}
.donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}

.donut-label .num{font-size:24px;font-weight:700}.donut-label .txt{font-size:10.5px;color:var(--gray-500)}
.legend{display:flex;flex-direction:column;gap:8px;font-size:13px}
.legend-item{display:flex;align-items:center;gap:8px}
.legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto;backdrop-filter:blur(4px)}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:720px;box-shadow:0 25px 50px rgba(0,0,0,.3);animation:modalIn .2s ease-out}
@keyframes modalIn{from{opacity:0;transform:translateY(-15px)}to{opacity:1;transform:translateY(0)}}
.modal-header{padding:18px 24px;background:linear-gradient(135deg,#0f172a,#0284c7);color:#fff;border-radius:16px 16px 0 0;display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:16px;font-weight:800}

.modal-body{padding:24px;max-height:70vh;overflow-y:auto;background:#fafbfc}
.modal-footer{padding:16px 24px;border-top:1px solid var(--gray-200);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;background:#f8fafc;border-radius:0 0 16px 16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.info-row{display:flex;gap:8px;padding:8px 0;border-bottom:1px dashed var(--gray-200)}

.info-row .val{font-weight:600;word-break:break-word}
#toast{position:fixed;bottom:24px;right:24px;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:14px 20px;border-radius:12px;font-size:13px;box-shadow:0 20px 40px rgba(0,0,0,.3);transform:translateY(100px);opacity:0;transition:.3s;z-index:200;max-width:340px;font-weight:600;backdrop-filter:blur(10px)}

.empty{text-align:center;padding:40px 20px;color:var(--gray-500)}
.empty .ic{font-size:44px;opacity:.3;margin-bottom:8px}

.team-card .team-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}

.hint{font-size:12px;color:var(--gray-500);margin-top:8px;line-height:1.6;background:var(--gray-50);padding:10px;border-radius:8px}

.zscore-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,#16a34a,#059669)}

.zscore-card.warn::before{background:linear-gradient(180deg,#f59e0b,#d97706)}

.zscore-card.bad::before{background:linear-gradient(180deg,#dc2626,#b91c1c)}
.zscore-row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px dashed rgba(15,23,42,.1)}
.zscore-row:last-child{border-bottom:none;border-top:2px solid rgba(15,23,42,.15);margin-top:4px;padding-top:8px;font-size:13.5px}

.photo-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:8px}

.tl-item{position:relative;padding-bottom:14px}
.tl-item::before{content:'';position:absolute;left:-20px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--primary-light)}

/* ==================== WHO Z-SCORE ==================== */
function interpVal(age, arr){
  const A = [0,3,6,9,12,18,24,36,48,60];
  if(age <= A[0]) return arr[0];
  if(age >= A[A.length-1]) return arr[arr.length-1];
  for(let i=0;i<A.length-1;i++){ if(age>=A[i] && age<=A[i+1]){ const t=(age-A[i])/(A[i+1]-A[i]); return arr[i]+t*(arr[i+1]-arr[i]); } }
  return arr[arr.length-1];
}
function zBBU(bb, age, jk){
  const M = jk==='L' ? [3.3,6.4,7.9,8.9,9.6,10.9,12.2,14.3,16.3,18.3] : [3.2,5.8,7.3,8.2,8.9,10.2,11.5,13.9,16.1,18.2];
  const S = jk==='L' ? [0.5,0.8,0.9,0.9,1.0,1.1,1.3,1.5,1.8,2.1] : [0.5,0.7,0.8,0.9,1.0,1.2,1.4,1.6,1.9,2.2];
  return (bb - interpVal(age, M)) / interpVal(age, S);
}
function zTBU(tb, age, jk){
  const M = jk==='L' ? [49.9,61.4,67.6,72.0,75.7,82.3,87.8,96.1,103.3,110.0] : [49.1,59.8,65.9,70.4,74.0,80.7,86.4,95.1,102.7,109.4];
  const S = jk==='L' ? [1.9,2.1,2.3,2.4,2.5,2.8,3.0,3.5,4.0,4.5] : [1.8,2.1,2.2,2.4,2.5,2.8,3.1,3.6,4.1,4.6];
  return (tb - interpVal(age, M)) / interpVal(age, S);
}
function klasifikasiZ(zB, zT){

/* ==================== CLOUD ==================== */
const Cloud = {
  status:'local', timer:null,
  init(){
    if(!_sb) _sb = supabase.createClient(CLOUD_URL, CLOUD_KEY);
    this.status = 'online'; this.updateIndicator();
    if(!this.timer) this.timer = setInterval(() => { if(APP.user) this.pull(true); }, 60000);
  },
  async push(){
    if(!_sb) return;
    try {
      this.setStatus('syncing');
      const {error} = await _sb.from('sistunting_state').upsert({id:'main', data:APP.state, updated_at:new Date().toISOString()});
      if(error) throw error;
      this.setStatus('online');
    } catch(e){ console.error(e); this.setStatus('error'); }
  },
  async pull(silent=false){
    if(!_sb) return;
    try {
      if(!silent) this.setStatus('syncing');
      const {data, error} = await _sb.from('sistunting_state').select('*').eq('id','main').maybeSingle();
      if(error) throw error;
      if(!data || !data.data){ this.setStatus('online'); return; }
      const cloudTime = new Date(data.updated_at);
      const localTime = APP.state.savedAt ? new Date(APP.state.savedAt) : new Date(0);
      if(cloudTime > localTime){
        APP.state = data.data;
        ['cases','tpk','accounts','auditLog'].forEach(k => { if(!APP.state[k]) APP.state[k] = []; });
        localStorage.setItem('zstunting_state', JSON.stringify(APP.state));
        if(APP.user && !silent){
          toast('📥 Data diperbarui','success');
          const active = document.querySelector('.nav-item.active')?.dataset.view || 'dashboard';
          showView(active, document.querySelector('.nav-item.active'));
          updateBadge();
        }
      }
      this.setStatus('online');
    } catch(e){ this.setStatus('error'); }
  },
  setStatus(s){ this.status = s; this.updateIndicator(); },
  updateIndicator(){
    const el = document.getElementById('syncStatus');
    if(!el) return;
    const map = {online:['online','☁️ Cloud'], syncing:['syncing','🔄 Sync...'], error:['error','⚠️ Error'], local:['','📱 Local']};
    const [cls, txt] = map[this.status] || map.local;
    el.className = 'sync-status ' + cls;
    el.innerHTML = '<span class="dot"></span> ' + txt;
  }
};

async function doLogin(e){

    let state = (data && data.data) || {cases:[], tpk:[], accounts:[], auditLog:[]};
    ['cases','tpk','accounts','auditLog'].forEach(k => { if(!state[k]) state[k] = []; });

    const admin = ADMIN_ACCOUNTS.find(a => a.u === u && a.p === p);
    if(admin){
      APP.user = {username:u, nama:admin.nama, role:'admin', avatar:'PK'};
      APP.state = state;
      localStorage.setItem('zstunting_state', JSON.stringify(state));
      localStorage.setItem('zstunting_session', JSON.stringify({username:u, at:new Date().toISOString()}));
      hideLoading(); enterApp();
      toast('Selamat datang, ' + admin.nama, 'success');
      return false;
    }
    const acc = state.accounts.find(a => a.username === u);
    if(!acc || String(acc.password||'').trim() !== p){ hideLoading(); toast('Username/password salah!','error'); return false; }
    const team = state.tpk.find(t => t.teamId === acc.teamId);
    if(!team){ hideLoading(); toast('Tim tidak ditemukan','error'); return false; }
    APP.user = {username:u, nama:'Tim ' + team.tim + ' · ' + team.desa, role:'kader', avatar:'TPK', teamId:acc.teamId, teamInfo:team};
    APP.state = state;
    localStorage.setItem('zstunting_state', JSON.stringify(state));
    localStorage.setItem('zstunting_session', JSON.stringify({username:u, at:new Date().toISOString()}));
    hideLoading(); enterApp();
    toast('Selamat datang, ' + APP.user.nama, 'success');
  } catch(err){
    console.warn(err);
    const admin = ADMIN_ACCOUNTS.find(a => a.u === u && a.p === p);
    if(admin){
      const local = localStorage.getItem('zstunting_state');
      APP.state = local ? JSON.parse(local) : {cases:[], tpk:[], accounts:[], auditLog:[]};
      ['cases','tpk','accounts','auditLog'].forEach(k => { if(!APP.state[k]) APP.state[k] = []; });

}

function getFilteredCases(){
  let arr = visibleCases();
  const f = APP.filters;
  if(f.search){ const s = f.search.toLowerCase(); arr = arr.filter(x => (x.nama||'').toLowerCase().includes(s) || (x.nik||'').includes(s) || (x.desa||'').toLowerCase().includes(s)); }
  if(f.kecamatan) arr = arr.filter(x => String(x.kecamatan||'').toUpperCase() === String(f.kecamatan).toUpperCase());
  if(f.status_gizi) arr = arr.filter(x => x.status_gizi === f.status_gizi);
  if(f.status_pendampingan) arr = arr.filter(x => x.status_pendampingan === f.status_pendampingan);
  return arr;
}

function pageRange(cur, total){
  const r = [];
  if(total <= 7){ for(let i=1;i<=total;i++) r.push(i); return r; }
  r.push(1); if(cur > 3) r.push('...');
  for(let i=Math.max(2,cur-1); i<=Math.min(total-1,cur+1); i++) r.push(i);
  if(cur < total-2) r.push('...'); r.push(total); return r;
}

function exportExcelReport(){
  if(typeof XLSX === 'undefined'){ toast('Library Excel belum siap','error'); return; }
  const cases = visibleCases();
  const sum = cases.map((x,i) => ({'No':i+1,'NIK':x.nik||'','Nama':x.nama||'','JK':x.jk||'','Tgl Lahir':x.tgl_lahir||'','Usia (bln)':x.usia_bulan||0,'Nama Ibu':x.nama_ibu||'','Nama Ayah':x.nama_ayah||'','Alamat':x.alamat||'','Desa':x.desa||'','Kecamatan':x.kecamatan||'','BB':x.bb||'','TB':x.tb||'','Status Gizi':x.status_gizi||'','Pendampingan':x.status_pendampingan||''}));
  const ws = XLSX.utils.json_to_sheet(sum);
  const wb = XLSX.utils.book_new();

/* ==================== WA GRUP ==================== */
function buildWAMessage(){
  const cases = APP.state.cases || [];
  const total = cases.length;
  const visited = cases.filter(x => x.riwayat && x.riwayat.length > 0).length;
  const stunting = cases.filter(x => x.status_gizi === 'Stunting').length;
  const giziKurang = cases.filter(x => x.status_gizi === 'Gizi Kurang').length;
  const giziBuruk = cases.filter(x => x.status_gizi === 'Gizi Buruk').length;
  const pct = total ? Math.round(visited/total*100) : 0;
  const now = new Date();
  const tgl = now.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const jam = now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  const perKec = {};
  cases.forEach(x => { const k = (x.kecamatan||'-').toUpperCase(); if(!perKec[k]) perKec[k] = {total:0,visited:0}; perKec[k].total++; if(x.riwayat && x.riwayat.length > 0) perKec[k].visited++; });
  const topKec = Object.entries(perKec).sort((a,b)=>b[1].total-a[1].total).slice(0,5).map(([kec,d])=>`• ${kec}: ${d.visited}/${d.total}`).join('\n');
  return `📢 *LAPORAN Z-STUNTING JENEPONTO*\n📅 ${tgl}\n🕐 ${jam} WITA\n\n━━━━━━━━━━━━━━━━━━━━\n\n📊 *STATISTIK:*\n👶 Total: *${total}*\n🏠 Dikunjungi: *${visited}* (${pct}%)\n⏳ Belum: *${total-visited}*\n\n🩸 *STATUS GIZI:*\n🔴 Stunting: *${stunting}*\n🟡 Gizi Kurang: *${giziKurang}*\n🔴 Gizi Buruk: *${giziBuruk}*\n\n━━━━━━━━━━━━━━━━━━━━\n\n📈 *PER KECAMATAN:*\n${topKec || '• Belum ada data'}\n\n━━━━━━━━━━━━━━━━━━━━\n\n🔗 Login: ${WEBSITE_URL}\n\n🎯 _Wujudkan Jeneponto Zero Stunting!_\n_"Satu Data, Satu Aksi Menuju Jeneponto Bahagia"_`;
}
function copyToClipboard(text){
  return new Promise((resolve, reject) => {
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(resolve).catch(reject);
    } else {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); resolve(); } catch(e){ reject(e); }
      document.body.removeChild(ta);
    }
  });
}
function kirimKeGrupWA(){
  const msg = buildWAMessage();
  copyToClipboard(msg).then(() => {
    toast('📋 Pesan dicopy — tempel di grup WA','success');
    setTimeout(() => window.open(WA_GRUP_TPK,'_blank'), 500);
  }).catch(() => {
    toast('⚠️ Gagal copy, buka grup manual','warning');
    window.open(WA_GRUP_TPK,'_blank');
  });
}

function generateAllAccounts(){
  const tpk = APP.state.tpk || [];
  if(tpk.length === 0){ toast('Import TPK dulu','warning'); return; }
  if(!confirm(`Generate ${tpk.length} akun? Akun lama akan diganti.`)) return;
  const sorted = tpk.slice().sort((a,b) => {
    const kc = a.kecamatan.localeCompare(b.kecamatan);
    if(kc !== 0) return kc;
    const dc = a.desa.localeCompare(b.desa);
    if(dc !== 0) return dc;
    return a.tim - b.tim;
  });
  APP.state.accounts = sorted.map((t,i) => ({username: 'tpk' + String(i+1).padStart(3,'0'), password: DEFAULT_PASS, teamId: t.teamId}));
  saveState();
  toast(`✅ ${APP.state.accounts.length} akun dibuat`,'success');
  renderAkun(document.getElementById('content'));
}
function exportAccountsCSV(){
  const accounts = APP.state.accounts || [];
  const tpk = APP.state.tpk || [];
  const rows = [['username','password','kecamatan','desa','tim','bidan','hp']];
  accounts.forEach(a => {
    const t = tpk.find(x => x.teamId === a.teamId);
    rows.push([a.username, a.password, t?.kecamatan||'', t?.desa||'', t?.tim||'', t?.bidan?.nama||'', t?.bidan?.hp||'']);
  });
  const csv = rows.map(r => r.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `Akun_TPK_${new Date().toISOString().slice(0,10)}.csv`; a.click();
  URL.revokeObjectURL(url);
  toast('✅ CSV diunduh','success');
}
function resetPasswordKader(username){
  const acc = (APP.state.accounts||[]).find(a => a.username === username);
  if(!acc){ toast('Akun tidak ditemukan','error'); return; }
  const t = (APP.state.tpk||[]).find(x => x.teamId === acc.teamId);
  document.getElementById('confirmTitle').textContent = '🔄 Reset Password';
  document.getElementById('confirmBody').innerHTML = `

  const btn = document.getElementById('confirmBtn');

}

async function handleFoto(e){
  const files = Array.from(e.target.files).slice(0,3);
  _photoCache = [];
  const preview = document.getElementById('fotoPreview');
  preview.innerHTML = '';
  for(const f of files){
    try {
      const compressed = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            const MAX = 800;
            if(w > h){ h = h * (MAX/w); w = MAX; } else { w = w * (MAX/h); h = MAX; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.65));
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(f);
      });
      _photoCache.push(compressed);
      const im = document.createElement('img'); im.src = compressed; im.onclick = () => viewPhoto(compressed);
      preview.appendChild(im);
    } catch(err){ console.warn(err); }
  }
  toast(`📸 ${_photoCache.length} foto siap`,'success');
}
function retryGPS(){
  const st = document.getElementById('gpsStatus');
  const tx = document.getElementById('gpsText');
  if(!navigator.geolocation){ st.className = 'gps-status gps-err'; tx.textContent = 'GPS tidak didukung'; return; }
  st.className = 'gps-status gps-wait';
  tx.textContent = 'Mendeteksi...';
  navigator.geolocation.getCurrentPosition(
    pos => {
      _gpsCache = {lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy};
      st.className = 'gps-status gps-ok';

/* ==================== AUTO ASSIGN ==================== */
function autoAssign(){
  const tpk = APP.state.tpk || [];
  const cases = APP.state.cases || [];
  if(!tpk.length || !cases.length) return;
  const groups = {}, desaIdx = {}, kecIdx = {};
  tpk.forEach(t => {
    const kecN = String(t.kecamatan||'').toUpperCase().trim();
    const desaN = String(t.desa||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    const key = kecN + '||' + desaN;
    if(!groups[key]) groups[key] = []; groups[key].push(t);
    if(!desaIdx[desaN]) desaIdx[desaN] = []; desaIdx[desaN].push(t);
    if(!kecIdx[kecN]) kecIdx[kecN] = []; kecIdx[kecN].push(t);
  });
  const counters = {};
  tpk.forEach(t => counters[t.teamId] = 0);
  cases.forEach(c => {
    const kecN = String(c.kecamatan||'').toUpperCase().trim();
    const desaN = String(c.desa||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    let pool = null;
    if(kecN && desaN) pool = groups[kecN + '||' + desaN];
    if((!pool || !pool.length) && desaN) pool = desaIdx[desaN];
    if((!pool || !pool.length) && kecN) pool = kecIdx[kecN];
    if(!pool || !pool.length){ c.team_id = null; return; }
    pool.sort((a,b) => counters[a.teamId] - counters[b.teamId]);
    c.team_id = pool[0].teamId;
    if(!c.kecamatan && pool[0].kecamatan) c.kecamatan = pool[0].kecamatan.toUpperCase();
    if(!c.desa && pool[0].desa) c.desa = pool[0].desa;
    counters[pool[0].teamId]++;
  });
}

function assignKecamatanLevel(){
  const tpk = APP.state.tpk || [];
  const cases = APP.state.cases || [];
  if(!tpk.length || !cases.length){ toast('Data kosong','error'); return; }
  const kecIdx = {};
  tpk.forEach(t => { if(!kecIdx[t.kecamatan]) kecIdx[t.kecamatan] = []; kecIdx[t.kecamatan].push(t); });
  const counters = {};
  tpk.forEach(t => counters[t.teamId] = 0);
  cases.forEach(c => { if(c.team_id && counters[c.team_id] !== undefined) counters[c.team_id]++; });
  let withDesa = 0, withoutDesa = 0, failed = 0;
  cases.forEach(c => {
    if(c.team_id) return;
    const kec = String(c.kecamatan||'').toUpperCase().trim();
    const desa = String(c.desa||'').toUpperCase().trim();
    if(!kec){ failed++; return; }
    let pool = kecIdx[kec] || [];
    if(!pool.length){ failed++; return; }
    pool.sort((a,b) => counters[a.teamId] - counters[b.teamId]);
    c.team_id = pool[0].teamId;
    counters[pool[0].teamId]++;
    if(!desa) c.perlu_verifikasi_desa = true;
    if(desa) withDesa++; else withoutDesa++;
  });
  saveState();
  toast(`✅ ${withDesa} (dengan desa) + ${withoutDesa} (kecamatan saja)${failed>0?` · ${failed} gagal`:''}`,'success');
  const active = document.querySelector('.nav-item.active')?.dataset.view;
  showView(active, document.querySelector('.nav-item.active'));
}

async function importTPKExcel(){
  const f = document.getElementById('excelTPK').files[0];
  if(!f){ toast('Pilih file Excel','warning'); return; }
  showLoading('Parsing Excel...');
  try {
    const buf = await f.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    let ws = wb.Sheets[wb.SheetNames[0]];
    for(const name of wb.SheetNames){
      const t = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:''});
      if(t.length > 1){
        const flat = t.flat().map(h => String(h||'').toLowerCase());
        if(flat.some(h => h.includes('bidan') || h.includes('nama tpk'))){ ws = wb.Sheets[name]; break; }
      }
    }
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    let cKec = '', cDesa = '', cTim = 0;
    const teams = {};
    for(let i=0; i<rows.length; i++){
      const r = rows[i]; if(!r || !r[4]) continue;
      const nama = String(r[4]).trim();
      if(!nama || nama.toLowerCase().includes('nama tpk')) continue;
      if(/^\d+\s*orang$/i.test(nama)) continue;
      if(r[1] && String(r[1]).trim()) cKec = String(r[1]).trim().toUpperCase();
      if(r[2] && String(r[2]).trim()) cDesa = String(r[2]).trim();
      if(r[3] && String(r[3]).trim()){ const m = String(r[3]).match(/(\d+)/); if(m) cTim = parseInt(m[1]); }
      if(!cKec || !cDesa || !cTim) continue;
      const unsur = String(r[5]||'').trim().toLowerCase();
      const hp = String(r[6]||'').trim().replace(/['\s\.]/g,'');
      const key = cKec + '#' + cDesa + '#' + cTim;
      if(!teams[key]) teams[key] = {kecamatan:cKec, desa:cDesa, tim:cTim, bidan:null, pkk:null, kb:null};
      const t = teams[key];
      if(unsur.includes('bidan')) t.bidan = {nama, hp};
      else if(unsur.includes('pkk')) t.pkk = {nama, hp};
      else if(unsur.includes('kb')) t.kb = {nama, hp};
    }
    const list = Object.values(teams).filter(t => t.bidan || t.pkk || t.kb).map((t,i) => ({
      id: 'TPK'+String(i+1).padStart(4,'0'),
      teamId: 'TIM-'+t.kecamatan.replace(/\s/g,'')+'-'+t.desa.replace(/\s/g,'')+'-'+t.tim,
      kecamatan: t.kecamatan, desa: t.desa, tim: t.tim,
      bidan: t.bidan || {nama:'-',hp:'-'}, pkk: t.pkk || {nama:'-',hp:'-'}, kb: t.kb || {nama:'-',hp:'-'}
    }));
    if(!list.length){ hideLoading(); toast('Tidak ada data TPK','error'); return; }
    if(!confirm(`Import ${list.length} tim TPK?`)){ hideLoading(); return; }
    APP.state.tpk = list;
    autoAssign();
    const sorted = list.slice().sort((a,b) => a.kecamatan.localeCompare(b.kecamatan) || a.desa.localeCompare(b.desa) || a.tim - b.tim);
    APP.state.accounts = sorted.map((t,i) => ({username: 'tpk'+String(i+1).padStart(3,'0'), password: DEFAULT_PASS, teamId: t.teamId}));
    saveState();
    hideLoading();
    toast(`✅ ${list.length} tim + ${list.length} akun`,'success');
    updateBadge();
    showView('tpk', document.querySelector('.nav-item[data-view="tpk"]'));
  } catch(e){ hideLoading(); console.error(e); toast('❌ Gagal: ' + e.message,'error'); }
}

/* ==================== IMPORT BNBA MULTI-FORMAT ==================== */
async function importBNBA(){
  const f = document.getElementById('csvBNBA')?.files[0];
  if(!f){ toast('Pilih file dulu','warning'); return; }
  showLoading('Membaca file...');
  try {
    let cases = [];
    const ext = f.name.split('.').pop().toLowerCase();
    if(ext === 'pdf') cases = await parsePDF(f);
    else if(ext === 'docx') cases = await parseDOCX(f);
    else if(ext === 'xlsx' || ext === 'xls') cases = await parseXLSX(f);
    else if(ext === 'csv' || ext === 'txt') cases = await parseCSVFile(f);
    else { hideLoading(); toast('Format tidak didukung','error'); return; }
    hideLoading();
    if(!cases.length){ alert('❌ Tidak ada data valid di file.'); return; }
    const fname = f.name.toUpperCase();
    let defDesa = '', defKec = '';
    for(const k of ['ARUNGKEKE','BANGKALA BARAT','BANGKALA','BATANG','BINAMU','BONTORAMBA','KELARA','RUMBIA','TAMALATEA','TAROWANG','TURATEA']){ if(fname.includes(k)){ defKec = k; break; } }
    const dm = fname.match(/(?:KEL\.|KELURAHAN|DESA)\s+([A-Z\s]+?)(?:\s+KEC|\s+BULAN|\s+TAHUN|\.|$)/);
    if(dm) defDesa = dm[1].trim();
    cases.forEach(c => { if(!c.kecamatan && defKec) c.kecamatan = defKec; if(!c.desa && defDesa) c.desa = defDesa; });
    const sum = {Stunting:0,'Gizi Kurang':0,'Gizi Buruk':0,Ideal:0,'Perlu Dicek':0};
    cases.forEach(c => { if(sum[c.status_gizi]!==undefined) sum[c.status_gizi]++; });
    const modeAdd = confirm(
      `📊 SUMMARY IMPORT\n\nFile: ${f.name}\nTotal: ${cases.length} kasus\n\n` +
      `🔴 Stunting: ${sum.Stunting}\n🟡 Gizi Kurang: ${sum['Gizi Kurang']}\n` +
      `🔴 Gizi Buruk: ${sum['Gizi Buruk']}\n🟢 Ideal: ${sum.Ideal}\n` +
      (sum['Perlu Dicek']>0?`⚠️ Perlu Dicek: ${sum['Perlu Dicek']}\n`:'') +
      `\nPreview 5:\n${cases.slice(0,5).map((c,i)=>`${i+1}. ${c.nama.substring(0,25)} — ${c.status_gizi}`).join('\n')}\n\n` +
      `Kec: ${defKec||'-'} · Desa: ${defDesa||'-'}\n\n` +
      `━━━━━━━━━━━━━━━━━━━━\n\n` +
      `✅ OK = TAMBAH (gabung dengan ${(APP.state.cases||[]).length} lama)\n` +
      `❌ CANCEL = GANTI SEMUA`
    );
    if(modeAdd){
      const old = APP.state.cases || [];
      const merged = [...old, ...cases];
      const seen = new Set();
      const unique = [];
      merged.forEach(c => {
        const key = ((c.nik||'') + '|' + (c.nama||'').toLowerCase().trim());
        if(!c.nama){ unique.push(c); return; }
        if(seen.has(key)) return;
        seen.add(key);
        unique.push(c);
      });
      APP.state.cases = unique;
    } else {
      APP.state.cases = cases;
    }
    autoAssign();
    saveState();
    toast(`✅ ${APP.state.cases.length} kasus total · ${sum.Stunting} stunting`,'success');
    updateBadge();
    showView('kasus', document.querySelector('.nav-item[data-view="kasus"]'));
  } catch(e){ hideLoading(); console.error(e); alert('❌ Gagal: ' + e.message); }
}
async function parsePDF(file){
  if(typeof pdfjsLib === 'undefined') throw new Error('PDF.js belum dimuat');
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  const allRows = [];
  for(let p = 1; p <= pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const items = tc.items.map(it => ({text: it.str, x: it.transform[4], y: it.transform[5], w: it.width}));
    const byY = {};
    items.forEach(it => { const k = Math.round(it.y/3)*3; if(!byY[k]) byY[k] = []; byY[k].push(it); });
    const ys = Object.keys(byY).map(Number).sort((a,b)=>b-a);
    for(const y of ys){
      const r = byY[y].sort((a,b)=>a.x-b.x);
      const cells = []; let cur = null;
      for(const it of r){
        if(cur && (it.x - (cur.x + cur.w)) < 15){ cur.text += ' ' + it.text; cur.w = it.x + it.w - cur.x; }
        else { if(cur) cells.push(cur.text.trim()); cur = {...it}; }
      }
      if(cur) cells.push(cur.text.trim());
      if(cells.filter(c=>c).length >= 2) allRows.push(cells);
    }
  }
  return parseRowsArray(allRows);
}
async function parseDOCX(file){
  if(typeof mammoth === 'undefined') throw new Error('Mammoth.js belum dimuat');
  const buf = await file.arrayBuffer();
  const result = await mammoth.convertToHtml({arrayBuffer: buf});
  const doc = new DOMParser().parseFromString(result.value, 'text/html');
  const allRows = [];
  doc.querySelectorAll('table').forEach(table => {
    table.querySelectorAll('tr').forEach(row => {
      const cells = Array.from(row.querySelectorAll('td,th')).map(c => c.textContent.trim());
      if(cells.filter(c=>c).length >= 2) allRows.push(cells);
    });
  });
  return parseRowsArray(allRows);
}
async function parseXLSX(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  let best = {name: wb.SheetNames[0], rows: [], score: -1};
  for(const name of wb.SheetNames){
    const t = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:'', raw:false});
    let score = 0;
    const flat = t.flat().map(h => String(h||'').toLowerCase());

    if(flat.some(h => h.includes('nik'))) score += 8;
    if(flat.some(h => h.includes('lahir'))) score += 5;
    if(flat.some(h => h.includes('stunting'))) score += 8;
    if(t.length > 2) score += Math.min(t.length, 30);

async function parseCSVFile(file){
  const text = await file.text();

  const rows = lines.map(line => {
    const vals = []; let cur = ''; let inQ = false;
    for(let i=0; i<line.length; i++){
      const ch = line[i];
      if(ch === '"'){ if(inQ && line[i+1]==='"'){ cur+='"'; i++; } else inQ = !inQ; }
      else if(ch === delim && !inQ){ vals.push(cur); cur = ''; }

function parseRowsArray(rows){

    let score = r.filter(v => String(v||'').trim()).length;
    if(joined.includes('nama')) score += 15;
    if(joined.includes('nik')) score += 10;
    if(joined.includes('lahir')) score += 5;
    if(joined.includes('stunting')) score += 10;
    if(score > maxScore){ maxScore = score; hIdx = i; }
  }
  if(hIdx === -1) hIdx = 0;
  const norm = h => String(h||'').toLowerCase().trim().replace(/[\/\.\-]/g,'_').replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'').replace(/_+/g,'_').replace(/^_|_$/g,'');

  const hdr2 = hIdx+1 < rows.length ? (rows[hIdx+1] || []).map(norm) : [];

  const isHdr2 = hdr2.some(h => h === 'bapak' || h === 'ibu' || h === 'ayah');
  const idx = {
    nama: findIdx(hdr1, ['nama_balita','nama_anak','nama']),
    nik: findIdx(hdr1, ['nik']),
    tgl: findIdx(hdr1, ['tgl_lahir','tanggal_lahir','tgl_lhr','lahir','tgl']),
    jk: findIdx(hdr1, ['jenis_kelamin','jenis_kel','jk','gender']),
    ayah: findIdx(hdr1, ['nama_ayah','ayah','bapak']) >= 0 ? findIdx(hdr1, ['nama_ayah','ayah','bapak']) : findIdx(hdr2, ['ayah','bapak']),
    ibu: findIdx(hdr1, ['nama_ibu','ibu']) >= 0 ? findIdx(hdr1, ['nama_ibu','ibu']) : findIdx(hdr2, ['ibu']),
    usia: findIdx(hdr1, ['usia_saat_ukur','usia','umur','age']),
    tglUkur: findIdx(hdr1, ['tanggal_pengukuran','tgl_pengukuran','tgl_ukur']),
    bb: findIdx(hdr1, ['berat_badan','berat','bb','weight']),
    tb: findIdx(hdr1, ['tinggi_badan','tinggi','tb','panjang','height']),
    lila: findIdx(hdr1, ['lila']),
    bbu: findIdx(hdr1, ['bb_u','bbu']),
    tbu: findIdx(hdr1, ['tb_u','tbu']),
    stunting: findIdx(hdr1, ['stunting']),
    ket: findIdx(hdr1, ['ket','keterangan','catatan'])
  };
  if(idx.nama === -1) throw new Error('Kolom "Nama" tidak ditemukan');
  const start = isHdr2 ? hIdx + 2 : hIdx + 1;
  const cases = [];

    const nama = gv(r, idx.nama).replace(/\s+/g,' ');

    if(/^(nama|no|jumlah|total|keterangan|kec|kel|desa|kab)$/i.test(nama)) continue;
    if(/^\d+$/.test(nama)) continue;
    const stuntingVal = gv(r, idx.stunting).toLowerCase();
    const bbuVal = gv(r, idx.bbu).toLowerCase();
    const tbuVal = gv(r, idx.tbu).toLowerCase();
    let giziFromFile = '';
    if(stuntingVal){
      if(/^(ya|yes|y|1|true|stunting)$/i.test(stuntingVal.replace(/\s/g,''))) giziFromFile = 'Stunting';
      else if(/^(tidak|no|n|0|false)$/i.test(stuntingVal.replace(/\s/g,''))) giziFromFile = bbuVal.includes('kurang') ? 'Gizi Kurang' : 'Ideal';

function buildCase(d){

  const pn = v => { const s = String(v||'').replace(',','.').replace(/[^\d.-]/g,''); return parseFloat(s) || 0; };
  const bb = pn(d.bb), tb = pn(d.tb), lila = pn(d.lila);

    tgl_lahir: tgl||'', usia_bulan: usia,
    nama_ibu: d.nama_ibu||'', nama_ayah: d.nama_ayah||'',

    status_verifikasi: perlu ? 'Perlu Dilengkapi' : 'Belum Dikunjungi',

function parseDate(s){
  s = String(s||'').trim().split(' ')[0];
  if(!s) return '';
  let m = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
  if(m){ let dd = parseInt(m[1]), mm = parseInt(m[2]), y = m[3]; if(mm > 12){ const t = dd; dd = mm; mm = t; } return `${y}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`; }
  m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  const bln = {jan:1,feb:2,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,agu:8,aug:8,sep:9,okt:10,oct:10,nov:11,des:12,dec:12};
  m = s.toLowerCase().match(/^(\d{1,2})\s+([a-z]{3})\s+(\d{4})$/);
  if(m){ const mm = bln[m[2]]; if(mm) return `${m[3]}-${String(mm).padStart(2,'0')}-${String(parseInt(m[1])).padStart(2,'0')}`; }

  return '';
}
